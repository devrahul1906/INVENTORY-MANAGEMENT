<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hatvet Pharma - Enterprise Inventory Management Portal</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1e3a8a;
      --primary-light: #eff6ff;
      --background: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --warning: #d97706;
      --success: #16a34a;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-fast: 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--background);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    .container { 
      width: 100%; 
      max-width: 1440px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 24px; 
      padding: 24px 32px;
      flex: 1;
    }
    
    .branding-header { 
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--card-bg);
      padding: 18px 32px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      width: 100%; 
    }
    .branding-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-icon { font-size: 2.2rem; line-height: 1; flex-shrink: 0; }
    .branding-text h2 { 
      font-size: 1.4rem; 
      font-weight: 800; 
      color: #1e3a8a; 
      letter-spacing: -0.02em; 
      white-space: nowrap; 
    }
    .branding-text p { 
      font-size: 0.75rem; 
      color: var(--text-muted); 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
      margin-top: 2px; 
      white-space: nowrap; 
    }

    .datetime-stamp-badge {
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e3a8a;
      background: var(--primary-light);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid #bfdbfe;
      font-family: monospace, var(--font-family);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .card {
      width: 100%; background-color: var(--card-bg); padding: 32px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-md); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 24px;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .login-wrapper { max-width: 440px; margin: 20px auto 0 auto; width: 100%; }

    .user-info-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 20px; 
    }
    .user-details { font-size: 1rem; color: var(--text-main); font-weight: 500; }

    .metrics-grid { 
      display: grid; 
      grid-template-columns: repeat(6, 1fr); 
      gap: 18px; 
    }
    .metric-card { 
      background: #ffffff; 
      border: 1px solid var(--border-color); 
      padding: 20px 18px; 
      border-radius: var(--radius-md); 
      text-align: left; 
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .metric-card.clickable { cursor: pointer; }
    .metric-card.clickable:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .metric-card.warning-card { background: #fffbeb; border-color: #fde68a; }
    .metric-card.danger-card { background: #fef2f2; border-color: #fecaca; }
    .metric-card.info-card { background: #f0fdf4; border-color: #bbf7d0; }
    .metric-card.main-wh-card { background: #f3e8ff; border-color: #d8b4fe; } 
    
    .metric-card span { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
    .metric-card h3 { font-size: 1.8rem; color: var(--primary); font-weight: 800; margin-top: 8px; }
    .metric-card.warning-card h3 { color: var(--warning); }
    .metric-card.danger-card h3 { color: var(--danger); }
    .metric-card.info-card h3 { color: var(--success); }
    .metric-card.main-wh-card h3 { color: #7e22ce; }
    
    .metric-card h3 .unit-pcs { font-size: 0.9rem; font-weight: 600; margin-left: 3px; opacity: 0.85; }

    .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.88rem; font-weight: 600; color: var(--text-main); }

    input[type="text"], input[type="password"], input[type="number"], input[type="date"], select {
      width: 100%; padding: 11px 14px; font-size: 0.92rem; font-family: inherit; color: var(--text-main); background-color: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

    .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 40px !important; }
    .toggle-password { position: absolute; right: 12px; cursor: pointer; user-select: none; font-size: 1.1rem; display: none; z-index: 10; }

    button {
      width: 100%; padding: 12px 18px; font-size: 0.92rem; font-weight: 600; font-family: inherit; color: #ffffff; background-color: var(--primary); border: none; border-radius: var(--radius-sm); cursor: pointer; box-shadow: var(--shadow-sm); transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    button:hover { background-color: var(--primary-hover); box-shadow: var(--shadow-md); }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; }
    button.btn-secondary { background-color: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
    button.btn-secondary:hover { background-color: #e2e8f0; }
    button.btn-success { background-color: var(--success); }
    button.btn-success:hover { background-color: #15803d; }
    button.btn-danger { background-color: var(--danger); }
    button.btn-danger:hover { background-color: var(--danger-hover); }
    button.btn-indigo { background-color: #4f46e5; }
    button.btn-indigo:hover { background-color: #4338ca; }
    button.btn-emerald { background-color: #059669; }
    button.btn-emerald:hover { background-color: #047857; }

    .history-list { max-height: 520px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 6px; }
    .history-date-group { display: flex; flex-direction: column; gap: 8px; }
    .history-date-header { font-size: 0.82rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 5px 12px; border-radius: var(--radius-sm); display: inline-block; width: fit-content; border: 1px solid #bfdbfe; }
    
    .history-item { 
      padding: 14px 20px; background-color: #ffffff; border-radius: var(--radius-sm); border: 1px solid var(--border-color); 
      display: grid; grid-template-columns: 1.2fr 2fr 1.2fr 0.8fr; gap: 16px; align-items: center; font-size: 0.9rem; box-shadow: var(--shadow-sm);
    }
    .history-item-header { font-weight: 700; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; background: #f8fafc; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; box-shadow: none; }

    .footer { font-size: 0.85rem; color: var(--text-muted); text-align: center; font-weight: 500; margin-top: auto; padding: 20px 0; border-top: 1px solid var(--border-color); width: 100%; background: #ffffff; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
    }

    .modal-box {
      background: var(--card-bg); width: 100%; max-width: 600px; border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 20px; animation: modalPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid var(--border-color);
    }

    .pdf-item-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
    .pdf-item-table th, .pdf-item-table td { border: 1px solid var(--border-color); padding: 12px 14px; text-align: left; }
    .pdf-item-table th { background: var(--primary-light); color: var(--primary); font-weight: 700; }

    @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @media(max-width: 1200px) {
      .metrics-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media(max-width: 900px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .action-grid { grid-template-columns: repeat(2, 1fr); }
      .container { padding: 16px; }
    }
    @media(max-width: 640px) {
      .branding-header { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; }
      .branding-text h2, .branding-text p { white-space: normal; }
      .metrics-grid { grid-template-columns: 1fr; }
      .action-grid { grid-template-columns: 1fr; }
      .history-item { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>

<body>

  <div id="app" class="container"></div>
  <div id="modal-container"></div>
  
  <input type="file" id="purchasePdfInput" accept="application/pdf" style="display:none;" onchange="handlePurchasePdfUpload(this)">

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // DO NOT FORGET TO UPDATE THIS IF YOU CREATE A NEW DEPLOYMENT URL
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwud7MzvPAEztXWngBEXKzjCjBybHm24imVw8uS7z_MvjBpDcCiMVblE9536QmNiJ2_/exec";

    let userScansCache = [];
    let pendingDispatchPayload = null;
    let pendingTransferPayload = null;
    let pendingDispatchReturnPayload = null;

    function formatNumber(val) {
      let num = parseInt(val, 10);
      if (isNaN(num)) num = 0;
      return num.toLocaleString('en-IN');
    }

    function updateLiveDateTime() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      
      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; 
      const hoursStr = String(hours).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const formattedStamp = `${day}-${month}-${year}, ${hoursStr}:${minutes}:${seconds} ${ampm}`;
      const elem = document.getElementById("live-datetime-stamp");
      if (elem) {
        elem.innerText = formattedStamp;
      }
    }

    setInterval(updateLiveDateTime, 1000);

    window.onload = function () {
      loadScansFromLocalStorage();
      if (localStorage.getItem("employee") && localStorage.getItem("warehouse")) {
        syncDataAndShowDashboard();
      } else {
        showLoginPage();
      }
      updateLiveDateTime();
    };

    function loadScansFromLocalStorage() {
      const stored = localStorage.getItem("userScansCache");
      if (stored) { try { userScansCache = JSON.parse(stored); } catch (e) { userScansCache = []; } }
    }

    function saveScansToLocalStorage() {
      localStorage.setItem("userScansCache", JSON.stringify(userScansCache));
    }

    async function fetchUserScansFromCloud() {
      const emp = localStorage.getItem("employee");
      if (!emp) return userScansCache;
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?employee=${encodeURIComponent(emp)}&warehouse=${encodeURIComponent(localStorage.getItem("warehouse") || "")}`);
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          userScansCache = data;
          saveScansToLocalStorage();
        }
        return userScansCache;
      } catch (e) {
        return userScansCache;
      }
    }

    async function fetchQaStock() {
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=qaStock`);
        const data = await response.json();
        const elem = document.getElementById("qaStockVal");
        if (elem) {
          elem.innerHTML = `${formatNumber(data.totalQty || 0)} <span class="unit-pcs">pcs</span>`;
        }
      } catch (e) {
        const elem = document.getElementById("qaStockVal");
        if (elem) elem.innerHTML = `0 <span class="unit-pcs">pcs</span>`;
      }
    }

    async function showWarehouseStockDetails() {
      const targetWh = "QA (Quality Assurance)";
      openStockDetailsModal("📦 QA (Quality Assurance)", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=warehouseStockDetails&warehouse=${encodeURIComponent(targetWh)}`);
        if (!response.ok) throw new Error("API Connection Failed");
        const list = await response.json();
        renderStockDetailsTable("📦 QA (Quality Assurance)", list);
      } catch (e) {
        console.error("Fetch Error:", e);
        renderStockDetailsTable("📦 QA (Quality Assurance)", []);

    function openStockDetailsModal(title, contentHtml) {
      document.getElementById("modal-container").innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box" style="max-height: 85vh; overflow-y: auto;">
            <h3 style="color:var(--primary);">${escapeHtml(title)}</h3>
            <div id="stockDetailsContent" style="margin-top: 4px;">${contentHtml}</div>
            <button onclick="closeModalAndResume()" class="btn-secondary" style="margin-top: 8px;">Close</button>
          </div>
        </div>
      `;
    }

    function renderStockDetailsTable(title, list) {
      let content = "";
      if (!Array.isArray(list) || list.length === 0) {
        content = `<p style="color:var(--text-muted); text-align:center; padding: 20px;">No products found.</p>`;
      } else {
        let rows = list.map(item => `
          <tr>
            <td><b>${escapeHtml(item.product)}</b></td>
            <td style="text-align: right; font-weight: 700; color: var(--primary);">${formatNumber(item.totalQty)} pcs</td>
          </tr>
        `).join("");

        content = `
          <table class="pdf-item-table">
            <thead>
              <tr>
                <th>Product Name</th>
                <th style="text-align: right;">Total Qty</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        `;
      }
      openStockDetailsModal(title, content);
    }

    function getBrandingHeader() {
      return `

              <h2>HATVET PHARMA PVT. LTD.</h2>

            </div>
          </div>
          <div class="datetime-stamp-badge" id="live-datetime-stamp">
            -- Loading --

    function getFooter() {
      return `<div class="footer">© 2026 Hatvet Pharma Pvt. Ltd. | Developed & Maintained by Sharma R.</div>`;

    function handlePasswordInput(input) {
      const toggleBtn = document.getElementById("togglePasswordBtn");
      if (toggleBtn) toggleBtn.style.display = input.value.length > 0 ? "block" : "none";
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById("password");
      const toggleBtn = document.getElementById("togglePasswordBtn");
      if (passInput && toggleBtn) {
        if (passInput.type === "password") { passInput.type = "text"; toggleBtn.innerText = "🫣"; }
        else { passInput.type = "password"; toggleBtn.innerText = "👁️"; }
      }
    }

    async function login() {
      let emp = document.getElementById("employee").value.trim();
      let pass = document.getElementById("password").value.trim();
      let wh = document.getElementById("warehouse").value;
      let loginBtn = document.getElementById("loginBtn");

      if (!emp || !pass || !wh) { alert("Please fill in Employee Name, Password, and select Warehouse!"); return; }

      if (loginBtn) { loginBtn.disabled = true; loginBtn.innerText = "⏳ Authenticating..."; }

      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=login&employee=${encodeURIComponent(emp)}&password=${encodeURIComponent(pass)}&warehouse=${encodeURIComponent(wh)}`);
        const data = await response.json();

        if (data.status === "success") {
          localStorage.setItem("employee", data.employeeName || emp);
          localStorage.setItem("warehouse", wh);
          localStorage.setItem("role", data.role || "Standard");
          syncDataAndShowDashboard();
        } else {
          alert("❌ Access Denied: " + (data.message || "Invalid Employee Name or Password!"));
          if (loginBtn) { loginBtn.disabled = false; loginBtn.innerText = "Sign In 🔓"; }
        }
      } catch (e) {
        alert("⚠️ Connection error!");
        if (loginBtn) { loginBtn.disabled = false; loginBtn.innerText = "Sign In 🔓"; }
      }
    }

    function showDashboard() {

    async function savePurchaseModalData() {
      let pCategory = document.getElementById("p_category").value;
      let pName = document.getElementById("p_name").value.trim();
      let pBatch = document.getElementById("p_batch").value.trim();
      let pMfg = document.getElementById("p_mfg").value;
      let pExp = document.getElementById("p_exp").value;
      let pMrp = document.getElementById("p_mrp").value;
      let rawQty = parseInt(document.getElementById("p_qty").value, 10) || 1;
      let pSupplier = document.getElementById("p_supplier").value.trim();
      let submitBtn = document.querySelector("#modal-container button.btn-success");

      if (!pCategory || !pName || !pBatch) { alert("Please fill in all required fields!"); return; }

      let finalQty = (pCategory.toLowerCase() === "tablets") ? rawQty * 10 : rawQty;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.innerText = "⏳ Saving..."; }

      let payload = {
        user: localStorage.getItem("employee") || "",
        warehouse: localStorage.getItem("warehouse") || "",
        type: "Purchase Entry",
        category: pCategory,
        supplier: pSupplier,
        product: pName,
        batch: pBatch,
        mfg: pMfg, exp: pExp, mrp: pMrp,
        qty: finalQty,
        scanTime: new Date().toLocaleString()
      };

      try {
        const response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const resData = JSON.parse(await response.text());

        if (resData.status === "success") {
          alert(`✅ Saved Successfully! Qty: ${finalQty}`);
          closeModalAndResume();
          await fetchUserScansFromCloud();
          showDashboard();
        } else {
          alert("❌ Error: " + resData.message);
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit Entry"; }
        }
      } catch (e) {
        alert("⚠️ Error: " + e.message);
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit Entry"; }
      }
    }

    async function handleDispatchPdfUpload(input) {
      if (!input.files || input.files.length === 0) return;
      let file = input.files[0];
      
      try {
        let arrayBuffer = await file.arrayBuffer();
        let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let textItems = [];

        for (let i = 1; i <= pdf.numPages; i++) {
          let page = await pdf.getPage(i);
          let textContent = await page.getTextContent();
          
          textContent.items.forEach(item => {
            textItems.push({
              str: item.str.trim(),
              x: item.transform[4],
              y: item.transform[5]
            });
          });
        }

        let fullText = textItems.map(item => item.str).join(" ");
        let invoiceMatch = fullText.match(/Invoice\s*No\.?\s*([A-Z0-9\-]+)/i) || fullText.match(/A00[0-9]+/);
        let invoiceNo = invoiceMatch ? (invoiceMatch[1] || invoiceMatch[0]) : "INV-" + Math.floor(Math.random() * 10000);

        let rowsMap = {};
        textItems.forEach(item => {
          let yKey = Math.round(item.y / 6) * 6;
          if (!rowsMap[yKey]) rowsMap[yKey] = [];
          rowsMap[yKey].push(item);
        });

        let itemsFound = [];
        let sortedYKeys = Object.keys(rowsMap).sort((a, b) => b - a);

        sortedYKeys.forEach(yKey => {
          let rowElements = rowsMap[yKey].sort((a, b) => a.x - b.x);
          let texts = rowElements.map(el => el.str).filter(t => t.length > 0);
          let rowString = texts.join(" ");

          if (rowString.includes("Invoice Date") || rowString.includes("Due Date") || 
              rowString.includes("Terms & Conditions") || rowString.includes("TOTAL") || 
              rowString.includes("Product Name") || rowString.includes("HSN")) {
            return;
          }

          let batchToken = texts.find(t => /^[A-Z0-9]{5,10}$/.test(t) && !t.includes("/") && t !== invoiceNo);
          let qtyToken = texts.find(t => /^\d{1,4}$/.test(t) && parseInt(t, 10) > 1);

          let prodName = "";
          let qty = 1;
          let potentialProduct = texts.find(t => t.includes("TAB") || t.includes("CAP") || t.includes("SYRUP") || t.includes("INJ") || t.includes("HAT"));
          
          if (potentialProduct && batchToken) {
            prodName = potentialProduct;
            qty = qtyToken ? parseInt(qtyToken, 10) : 1;

            let exists = itemsFound.some(item => item.product === prodName && item.batch === batchToken);
            if (!exists) {
              itemsFound.push({
                product: prodName,
                batch: batchToken,
                qty: qty
              });
            }
          }
        });

        if (itemsFound.length === 0) {
          alert("⚠️ Failed to read valid product items from Dispatch PDF.");
          input.value = "";
          return;
        }

        pendingDispatchPayload = {
          action: "dispatch",
          user: localStorage.getItem("employee") || "",
          warehouse: localStorage.getItem("warehouse") || "",
          invoiceNo: invoiceNo,
          items: itemsFound
        };

        openDispatchConfirmationModal();
      } catch (err) {
        alert("⚠️ PDF Parsing Error: " + err.message);
      }
      input.value = "";
    }

          closeModalAndResume();
          await fetchUserScansFromCloud();
          showDashboard();
        } else {
          alert("❌ REJECTED:\n\n" + resData.message);
          closeModalAndResume();
        }
      } catch (err) {
        alert("⚠️ " + err.message);
        closeModalAndResume();
      }
    }

    async function handleDispatchReturnPdfUpload(input) {
      if (!input.files || input.files.length === 0) return;
      let file = input.files[0];
      
      try {
        let arrayBuffer = await file.arrayBuffer();
        let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let textItems = [];

        for (let i = 1; i <= pdf.numPages; i++) {
          let page = await pdf.getPage(i);
          let textContent = await page.getTextContent();
          
          textContent.items.forEach(item => {
            textItems.push({
              str: item.str.trim(),
              x: item.transform[4],
              y: item.transform[5]
            });
          });
        }

        let fullText = textItems.map(item => item.str).join(" ");
        let invoiceMatch = fullText.match(/Invoice\s*No\.?\s*([A-Z0-9\-]+)/i) || fullText.match(/CN[0-9]+/i);
        let invoiceNo = invoiceMatch ? (invoiceMatch[1] || invoiceMatch[0]) : "RET-" + Math.floor(Math.random() * 10000);

        let itemsFound = [];
        let rowsMap = {};
        
        textItems.forEach(item => {
          let yKey = Math.round(item.y / 8) * 8; 
          if (!rowsMap[yKey]) rowsMap[yKey] = [];
          rowsMap[yKey].push(item);
        });

        let sortedYKeys = Object.keys(rowsMap).sort((a, b) => b - a);
        let currentDate = new Date();

        sortedYKeys.forEach(yKey => {
          let rowElements = rowsMap[yKey].sort((a, b) => a.x - b.x);
          let texts = rowElements.map(el => el.str).filter(t => t.length > 0);
          let rowString = texts.join(" ");
          let hasExpiry = texts.some(t => /^\d{1,2}\/\d{2,4}$/.test(t));

          if (texts.length >= 4 && (hasExpiry || rowString.includes("SYRUP") || rowString.includes("TAB") || rowString.includes("CAP") || rowString.includes("INJ") || rowString.includes("AZITHROHAT"))) {
            let prodName = "";
            let batchNo = "";
            let qty = 1;
            let expStr = "";
            let mrp = "0.00";

            let expIndex = texts.findIndex(t => /^\d{1,2}\/\d{2,4}$/.test(t));
            if (expIndex !== -1) {
              expStr = texts[expIndex];
              
              for (let j = expIndex - 1; j >= 0; j--) {
                let val = texts[j];
                if (/^[A-Z0-9\-\/]{3,}$/.test(val) && !val.match(/^\d{6,}$/) && val !== expStr && !val.includes("TAB") && !val.includes("SYRUP") && !val.includes("INJ") && !val.includes("AZITHROHAT")) {
                  batchNo = val;
                  break;
                }
              }

              if (!batchNo || batchNo.length < 3 || batchNo === prodName) {
                let foundBatch = texts.find(t => /^[A-Z]{2,3}[\-\/]?\d{3,5}$/.test(t) || /^[A-Z0-9]{5,10}$/.test(t) && t !== expStr);
                if (foundBatch) batchNo = foundBatch;
              }

              for (let j = expIndex - 1; j >= 0; j--) {
                let val = texts[j];
                if (/^\d{1,3}$/.test(val) && val !== batchNo && parseInt(val) < 500) {
                  qty = parseInt(val, 10);
                  break;
                }
              }

              let mrpToken = texts.find(t => /^\d{2,3}\.\d{2}$/.test(t));
              if (mrpToken) { mrp = mrpToken; }

              let nameParts = [];
              for (let j = 0; j < texts.length; j++) {
                if (texts[j] === qty.toString() || texts[j] === batchNo || texts[j] === expStr || texts[j] === mrp || /^\d+\.?$/.test(texts[j])) {
                  break;
                }
                nameParts.push(texts[j]);
              }
              if (nameParts.length > 0) {
                prodName = nameParts.join(" ").replace(/^\d+\.\s*/, "").trim();
              }
            }

            if (!prodName && texts.length >= 3) {
              prodName = texts[1] || texts[0];
              qty = parseInt(texts.find(t => /^\d{1,2}$/.test(t)), 10) || 1;
              batchNo = texts.find(t => /^[A-Z0-9\-]{3,}$/.test(t) && !t.includes("/")) || "N/A";
              expStr = texts.find(t => /^\d{1,2}\/\d{2,4}$/.test(t)) || "05/28";
            }

            if (prodName && prodName.length > 2 && !prodName.toLowerCase().includes("total") && !prodName.toLowerCase().includes("credit")) {
              let formattedExpDate = parsePdfExpiryToDate(expStr);
              let statusText = "Usable";
              let statusClass = "color:var(--success); font-weight:700;";

              if (formattedExpDate) {
                let expDateObj = new Date(formattedExpDate);
                let timeDiff = expDateObj.getTime() - currentDate.getTime();
                let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));

                if (daysDiff <= 270) {
                  statusText = "Expired";
                  statusClass = "color:var(--danger); font-weight:700;";
                }
              }

              if (batchNo === prodName || !batchNo) {
                batchNo = "N/A";
              }

              let exists = itemsFound.some(item => item.product === prodName && item.batch === batchNo);
              if (!exists) {
                itemsFound.push({
                  product: prodName,
                  batch: batchNo,
                  qty: qty,
                  exp: expStr || "N/A",
                  mrp: mrp,
                  expDate: formattedExpDate || "2030-01-01",
                  status: statusText,
                  statusClass: statusClass
                });
              }
            }
          }
        });

        if (itemsFound.length === 0) {
          alert("⚠️ Failed to extract items from Dispatch Return PDF. Please check the PDF layout.");
          input.value = "";
          return;
        }

        pendingDispatchReturnPayload = {
          action: "dispatch_return",
          user: localStorage.getItem("employee") || "",
          warehouse: localStorage.getItem("warehouse") || "",
          invoiceNo: invoiceNo,
          items: itemsFound
        };

        openDispatchReturnConfirmationModal();
      } catch (err) {
        alert("⚠️ PDF Parsing Error: " + err.message);
      }
      input.value = "";
    }

    function parsePdfExpiryToDate(expStr) {
      if (!expStr || !expStr.includes("/")) return "2030-01-01";
      let parts = expStr.split("/");
      let month = parts[0].padStart(2, '0');
      let year = parts[1];
      if (year.length === 2) { year = "20" + year; }
      return `${year}-${month}-01`;
    }

    function openDispatchReturnConfirmationModal() {
      if (!pendingDispatchReturnPayload) return;

      let itemsRows = pendingDispatchReturnPayload.items.map(item => `
        <tr>
          <td><b>${escapeHtml(item.product)}</b></td>
          <td>${escapeHtml(item.batch)}</td>
          <td><b>${formatNumber(item.qty)} pcs</b></td>
          <td><b>₹${escapeHtml(item.mrp)}</b></td>
          <td>${escapeHtml(item.exp)}</td>
          <td><span style="${item.statusClass}">${escapeHtml(item.status)}</span></td>
        </tr>
      `).join("");

      document.getElementById("modal-container").innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box" style="max-width: 720px; max-height: 90vh; overflow-y: auto;">
            <h3 style="color:var(--primary);">📦 Dispatch Return Verification</h3>
            <p style="font-size:0.9rem;"><b>Invoice / Credit Note No:</b> ${escapeHtml(pendingDispatchReturnPayload.invoiceNo)}</p>
            
            <table class="pdf-item-table" style="font-size:0.88rem;">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Batch</th>
                  <th>Qty</th>
                  <th>MRP</th>
                  <th>Exp</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${itemsRows}
              </tbody>
            </table>
            
            <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">
              ℹ️ ≤270D → <b>Expired Inventory</b>, others → <b>Usable Inventory</b>.
            </p>

            <div style="display:flex; gap:12px; margin-top:8px;">
              <button onclick="confirmAndExecuteDispatchReturn()" class="btn-success">Confirm & Sync</button>
              <button onclick="closeModalAndResume()" class="btn-danger">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    async function confirmAndExecuteDispatchReturn() {
      if (!pendingDispatchReturnPayload) return;
      let confirmBtn = document.querySelector("#modal-container button.btn-success");
      if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.innerText = "⏳ Processing Return..."; }

      try {
        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(pendingDispatchReturnPayload)
        });
        let resData = JSON.parse(await response.text());

        if (resData.status === "success") {
          alert("✅ " + resData.message);
          pendingDispatchReturnPayload = null;
          closeModalAndResume();
          await fetchUserScansFromCloud();
          showDashboard();
        } else {
          alert("❌ ERROR:\n\n" + resData.message);
          closeModalAndResume();
        }
      } catch (err) {
        alert("⚠️ Connection Error: " + err.message);
        closeModalAndResume();
      }
    }

    async function handlePurchasePdfUpload(input) { if (input.files && input.files.length > 0) alert("PDF Selected!"); closeModalAndResume(); input.value = ""; }
    function closeModalAndResume() { document.getElementById("modal-container").innerHTML = ""; }

    function showShortItemPage() {
      document.getElementById("app").innerHTML = `
        ${getBrandingHeader()}
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: var(--text-main);">📉 Short Item List</h3>
            <button onclick="showDashboard()" class="btn-secondary" style="width: auto; padding: 8px 18px;">⬅️ Back to Dashboard</button>
          </div>
          <div id="short-item-container" style="margin-top: 15px;"></div>
        </div>
        ${getFooter()}
      `;
      updateLiveDateTime();
      loadShortItemList();
    }

    async function loadShortItemList() {
      let container = document.getElementById('short-item-container'); 
      container.innerHTML = "<div style='text-align:center; padding: 20px;'><b>Loading Short Items...</b></div>";
      
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=shortItems`);
        const items = await response.json();
        
        let html = '';
        if(!items || items.length === 0) {
          html = "<div style='text-align:center; padding: 15px; background: #d1e7dd; color: #0f5132; border-radius: 6px;'>All items have sufficient stock (1000 or more).</div>";
        } else {
          html = `<table class="pdf-item-table" style="width:100%; border-collapse:collapse;">
                    <thead>
                      <tr>
                        <th style="padding:10px; border:1px solid var(--border-color);">Product Name</th>
                        <th style="padding:10px; border:1px solid var(--border-color);">Quantity</th>
                        <th style="padding:10px; border:1px solid var(--border-color);">Warehouse Location</th>
                      </tr>
                    </thead>
                    <tbody>`;
          items.forEach(function(item) {
            html += `<tr>
                       <td style="padding:10px; border:1px solid var(--border-color);"><b>${escapeHtml(item.productName)}</b></td>
                       <td style="padding:10px; border:1px solid var(--border-color); color: var(--danger); font-weight: bold;">${formatNumber(item.qty)}</td>
                       <td style="padding:10px; border:1px solid var(--border-color);">${escapeHtml(item.location)}</td>
                     </tr>`;
          });
          html += `</tbody></table>`;
        }
        container.innerHTML = html;
      } catch (error) {
         console.error(error);
         container.innerHTML = "<div style='text-align:center; padding: 15px; background: #f8d7da; color: #842029; border-radius: 6px;'>Error loading data.</div>";
      }
    }

    function historyPage() {
      let groupedByDate = {};

      userScansCache.forEach((item) => {
        let rawDate = item.timestamp ? new Date(item.timestamp) : new Date();
        let dateKey = isNaN(rawDate.getTime()) ? "Recent Entries" : rawDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        
        if (!groupedByDate[dateKey]) {
          groupedByDate[dateKey] = [];
        }
        groupedByDate[dateKey].push(item);
      });

      let historyHtml = Object.keys(groupedByDate).length === 0 ? '<p style="text-align:center; color: var(--text-muted); padding: 20px;">No history found.</p>' : '';

      for (let dateKey in groupedByDate) {
        historyHtml += `
          <div class="history-date-group">
            <span class="history-date-header">📅 ${dateKey}</span>
            <div class="history-item history-item-header">
              <div>Category</div>
              <div>Product Name</div>
              <div>Batch No.</div>
              <div>Qty</div>
            </div>
        `;

        groupedByDate[dateKey].forEach((item) => {
          let userCategoryText = item.inventoryType || item.type || "Purchase Entry";
          historyHtml += `
            <div class="history-item">
              <div style="font-weight:600; color:var(--primary);">${escapeHtml(userCategoryText)}</div>
              <div style="font-weight:700;">${escapeHtml(item.product)}</div>
              <div>${escapeHtml(item.batch)}</div>
              <div style="font-weight:700;">${formatNumber(item.quantity || 1)} pcs</div>
            </div>
          `;
        });

        historyHtml += `</div>`;
      }

      document.getElementById("app").innerHTML = `
        ${getBrandingHeader()}
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: var(--text-main);">📜 Workflow History</h3>
            <button onclick="showDashboard()" class="btn-secondary" style="width: auto; padding: 8px 18px;">⬅️ Back to Dashboard</button>
          </div>
          <div class="history-list">${historyHtml}</div>
          <div style="display: flex; gap: 12px; margin-top: 6px;">
            <button onclick="downloadHistoryPDF()" class="btn-indigo" style="font-size:0.9rem; padding:12px;">📥 Download PDF Report</button>
            <button onclick="downloadHistoryExcel()" class="btn-emerald" style="font-size:0.9rem; padding:12px;">📊 Download Excel Report</button>
          </div>
        </div>
        ${getFooter()}
      `;
      updateLiveDateTime();
    }

    function downloadHistoryPDF() {
      if (!userScansCache || userScansCache.length === 0) {
        alert("No history data available to download!");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.setTextColor(30, 58, 138);
      doc.text("HATVET PHARMA PVT LTD - Workflow History", 14, 20);

      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      doc.text(`Employee: ${localStorage.getItem("employee") || "N/A"} | Warehouse: ${localStorage.getItem("warehouse") || "N/A"}`, 14, 28);

      let tableData = userScansCache.map(item => {
        let cat = item.inventoryType || item.type || "Purchase Entry";
        let dateStr = item.timestamp ? new Date(item.timestamp).toLocaleDateString('en-GB') : "N/A";
        return [dateStr, cat, item.product || "", item.batch || "", formatNumber(item.quantity || 1) + " pcs"];
      });

      doc.autoTable({
        startY: 34,
        head: [['Date', 'Category', 'Product Name', 'Batch No.', 'Qty']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [37, 99, 235] }
      });

      doc.save(`Workflow_History_${new Date().toISOString().slice(0,10)}.pdf`);
    }

    function downloadHistoryExcel() {
      if (!userScansCache || userScansCache.length === 0) {
        alert("No history data available to download!");
        return;
      }

      let excelData = userScansCache.map(item => {
        let cat = item.inventoryType || item.type || "Purchase Entry";
        let dateStr = item.timestamp ? new Date(item.timestamp).toLocaleDateString('en-GB') : "N/A";
        return {
          "Date": dateStr,
          "Category": cat,
          "Product Name": item.product || "",
          "Batch No.": item.batch || "",
          "Quantity": `${formatNumber(item.quantity || 1)} pcs`,
          "Warehouse": item.warehouse || "",
          "Employee": item.user || ""
        };
      });

      let worksheet = XLSX.utils.json_to_sheet(excelData);
      let workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Workflow History");
      XLSX.writeFile(workbook, `Workflow_History_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function logout() { localStorage.clear(); userScansCache = []; showLoginPage(); }
    function escapeHtml(str) { return !str ? '' : String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  </script>
