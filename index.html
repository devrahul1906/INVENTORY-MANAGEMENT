                                ) > 30
                            ) {

                                return false;

                            }


                            if (
                                headers.qty !== null &&
                                Math.abs(
                                    item.x -
                                    headers.qty
                                ) <= 12
                            ) {

                                return false;

                            }


                            return true;

                        }
                    );


                if (
                    !actualSeparateFree
                ) {

                    freeQty = 0;

                }

            }


            // ====================================================
            // FINAL QTY DEFAULTS
            // ====================================================

            if (
                billedQty === null ||
                !Number.isFinite(billedQty)
            ) {

                billedQty = 0;

            }


            if (
                freeQty === null ||
                !Number.isFinite(freeQty)
            ) {

                freeQty = 0;

            }


            // ====================================================
            // TOTAL QTY
            // ====================================================

            const totalQty =
                Number(billedQty) +
                Number(freeQty);


            // ====================================================
            // DEBUG
            // ====================================================

            console.log(
                "================================"
            );

            console.log(
                "MARG QTY/FREE"
            );

            console.log(
                "Product:",
                productResult.product
            );

            console.log(
                "Qty Header X:",
                headers.qty
            );

            console.log(
                "Free Header X:",
                headers.free
            );

            console.log(
                "Batch Header X:",
                headers.batch
            );

            console.log(
                "Numeric Candidates:",
                qtyFreeCandidates.map(
                    x => ({
                        value: x.value,
                        x: x.x
                    })
                )
            );

            console.log(
                "Billed Qty:",
                billedQty
            );

            console.log(
                "Free Qty:",
                freeQty
            );

            console.log(
                "Total Qty:",
                totalQty
            );

            console.log(
                "================================"
            );


            // ====================================================
            // FALLBACK QTY
            // ====================================================

            if (
                billedQty === 0
            ) {

                const productMatchItem =
                    row.items.find(item =>
                        alphaNum(item.str)
                            .includes(
                                alphaNum(
                                    productResult.product
                                )
                            )
                    );


                const productX =
                    productMatchItem?.x ?? 0;


                const afterProduct =
                    numeric
                        .filter(
                            item =>
                                item.x >
                                productX
                        )
                        .sort(
                            (a, b) =>
                                a.x - b.x
                        );


                if (
                    afterProduct.length
                ) {

                    billedQty =
                        afterProduct[0].value;

                }

            }


            // ====================================================
            // BATCH
            // ====================================================

            let batch = "";


            const batchCandidates =
                row.items

                    .filter(item => {

                        const s =
                            item.str.trim();


                        if (
                            !isBatchLike(s)
                        ) {
                            return false;
                        }


                        if (
                            isDateLike(s)
                        ) {
                            return false;
                        }


                        if (
                            s.toUpperCase() ===
                            productResult.product
                                .toUpperCase()
                        ) {
                            return false;
                        }


                        return true;

                    })

                    .map(item => ({

                        ...item,

                        distance:
                            distance(
                                item.x,
                                headers.batch
                            )

                    }))

                    .sort(
                        (a, b) =>
                            a.distance -
                            b.distance
                    );


            if (
                batchCandidates.length
            ) {

                const selected =
                    batchCandidates.find(
                        x =>
                            x.distance <= 55
                    );


                if (selected) {

                    batch =
                        selected.str.trim();

                }

            }


            // ====================================================
            // EXPIRY
            // ====================================================

            let exp = "";


            const expiryCandidates =
                row.items

                    .filter(item =>
                        isDateLike(
                            item.str
                        )
                    )

                    .map(item => ({

                        ...item,

                        distance:
                            distance(
                                item.x,
                                headers.exp
                            )

                    }))

                    .sort(
                        (a, b) =>
                            a.distance -
                            b.distance
                    );


            if (
                expiryCandidates.length
            ) {

                const selected =
                    expiryCandidates.find(
                        x =>
                            headers.exp !== null
                                ? x.distance <= 50
                                : true
                    );


                if (selected) {

                    exp =
                        selected.str.trim();

                }

            }


            // ====================================================
            // HSN
            // ====================================================

            let hsn = "";


            const hsnCandidates =
                row.items
                    .map(
                        x =>
                            x.str.trim()
                    )
                    .filter(
                        x =>
                            /^\d{6,8}$/
                                .test(x)
                    );


            if (
                hsnCandidates.length
            ) {

                hsn =
                    hsnCandidates[0];

            }


            // ====================================================
            // STATUS
            // ====================================================

            let status = "OK";


            if (
                !productResult.product
            ) {

                status =
                    "PRODUCT_NOT_MATCHED";

            }


            if (
                billedQty <= 0
            ) {

                status =
                    "QTY_SUSPICIOUS";

            }


            if (!batch) {

                status =
                    "BATCH_SUSPICIOUS";

            }


            if (
                productResult.confidence < 0.75 &&
                status === "OK"
            ) {

                status =
                    "LOW_CONFIDENCE";

            }


            // ====================================================
            // PUSH ITEM
            // ====================================================

            itemsFound.push({

                serial:
                    row.serial,

                page:
                    row.page,

                product:
                    productResult.product,

                batch:
                    batch || "UNKNOWN",

                exp:
                    exp || "",

                hsn:
                    hsn,

                billedQty:
                    billedQty,

                freeQty:
                    freeQty,

                qty:
                    Number(billedQty) +
                    Number(freeQty),

                confidence:
                    Number(
                        productResult
                            .confidence
                            .toFixed(2)
                    ),

                status:
                    status,

                rawText:
                    rowText

            });

        }


        // ========================================================
        // SORT BY SERIAL
        // ========================================================

        itemsFound.sort(
            (a, b) =>
                a.serial - b.serial
        );


        // ========================================================
        // REMOVE EXACT PHYSICAL DUPLICATES
        // ========================================================

        const uniqueRows = [];

        const physicalRowKeys =
            new Set();


        for (
            const item of itemsFound
        ) {

            const key =
                `${item.page}|${item.serial}|${item.rawText}`;


            if (
                physicalRowKeys.has(key)
            ) {

                continue;

            }


            physicalRowKeys.add(key);

            uniqueRows.push(item);

        }


        const finalItems =
            uniqueRows;


        // ========================================================
        // EXPECTED TOTAL ITEMS
        // ========================================================

        let expectedItems = null;


        const itemMatch =
            allText.match(
                /Total\s+Items\s*[:\-]?\s*(\d+)/i
            );


        if (itemMatch) {

            expectedItems =
                parseInt(
                    itemMatch[1],
                    10
                );

        }


        // ========================================================
        // EXPECTED TOTAL QTY
        // ========================================================

        let expectedQty = null;


        const qtyMatch =
            allText.match(
                /Total\s+Qty\s*[:\-]?\s*([\d,]+)/i
            );


        if (qtyMatch) {

            expectedQty =
                parseInt(
                    qtyMatch[1]
                        .replace(/,/g, ""),
                    10
                );

        }


        // ========================================================
        // EXTRACTED TOTALS
        // ========================================================

        const extractedItems =
            finalItems.length;


        const extractedQty =
            finalItems.reduce(
                (sum, item) =>
                    sum +
                    Number(
                        item.qty || 0
                    ),
                0
            );


        // ========================================================
        // SERIAL VALIDATION
        // ========================================================

        const serialNumbers =
            finalItems
                .map(
                    x => x.serial
                )
                .filter(
                    x =>
                        Number.isFinite(x)
                );


        const duplicateSerials =
            serialNumbers.filter(
                (v, i, arr) =>
                    arr.indexOf(v) !== i
            );


        let missingSerials = [];


        if (
            expectedItems !== null
        ) {

            for (
                let i = 1;
                i <= expectedItems;
                i++
            ) {

                if (
                    !serialNumbers.includes(i)
                ) {

                    missingSerials.push(i);

                }

            }

        }


        // ========================================================
        // VALIDATION
        // ========================================================

        const validationErrors = [];


        if (
            expectedItems !== null &&
            extractedItems !== expectedItems
        ) {

            validationErrors.push(
                `ITEM COUNT MISMATCH: MARG=${expectedItems}, READ=${extractedItems}`
            );

        }


        if (
            expectedQty !== null &&
            extractedQty !== expectedQty
        ) {

            validationErrors.push(
                `QTY MISMATCH: MARG=${expectedQty}, READ=${extractedQty}`
            );

        }


        if (
            duplicateSerials.length
        ) {

            validationErrors.push(
                `DUPLICATE SERIAL: ${duplicateSerials.join(", ")}`
            );

        }


        if (
            missingSerials.length
        ) {

            validationErrors.push(
                `MISSING SERIAL: ${missingSerials.join(", ")}`
            );

        }


        // ========================================================
        // SUSPICIOUS ITEMS
        // ========================================================

        const suspiciousItems =
            finalItems.filter(
                item =>
                    item.status !== "OK"
            );


        // ========================================================
        // VALIDATION SUMMARY
        // ========================================================

        const validationPassed =
            validationErrors.length === 0 &&
            suspiciousItems.length === 0;


        console.log(
            "================================="
        );

        console.log(
            "MARG PDF VALIDATION"
        );

        console.log(
            "================================="
        );

        console.log(
            "Invoice:",
            invoiceNo
        );

        console.log(
            "Expected Items:",
            expectedItems
        );

        console.log(
            "Extracted Items:",
            extractedItems
        );

        console.log(
            "Expected Qty:",
            expectedQty
        );

        console.log(
            "Extracted Qty:",
            extractedQty
        );

        console.log(
            "Suspicious Rows:",
            suspiciousItems.length
        );

        console.log(
            "Validation:",
            validationPassed
        );

        console.log(
            "================================="
        );


        // ========================================================
        // NO ITEMS
        // ========================================================

        if (
            finalItems.length === 0
        ) {

            alert(
                "❌ Invalid PDF Format\n\n" +
                "Please check the invoice format."
            );


            input.value = "";

            return;

        }


        // ========================================================
        // VALIDATION FAILURE
        // ========================================================

        if (
            !validationPassed
        ) {

            let message =
                "⚠️ INVOICE VERIFICATION FAILED\n\n";


            if (invoiceNo) {

                message +=
                    `Invoice: ${invoiceNo}\n\n`;

            }


            if (
                expectedItems !== null
            ) {

                message +=
                    `MARG Total Items: ${expectedItems}\n`;

            }


            message +=
                `System Read Items: ${extractedItems}\n\n`;


            if (
                expectedQty !== null
            ) {

                message +=
                    `MARG Total Qty: ${expectedQty}\n`;

            }


            message +=
                `System Read Qty: ${extractedQty}\n\n`;


            if (
                validationErrors.length
            ) {

                message +=
                    "Problems:\n";


                validationErrors
                    .slice(0, 10)
                    .forEach(error => {

                        message +=
                            "• " +
                            error +
                            "\n";

                    });

            }


            if (
                suspiciousItems.length
            ) {

                message +=
                    `\n⚠️ Suspicious Rows: ${suspiciousItems.length}\n`;


                suspiciousItems
                    .slice(0, 10)
                    .forEach(item => {

                        message +=
                            `• S.No ${item.serial}: ` +
                            `${item.product || "UNKNOWN"} ` +
                            `[${item.status}]\n`;

                    });

            }


            message +=
                "\n❌ Data will not save automatically.";


            alert(message);


            // ====================================================
            // REVIEW PAYLOAD
            // ====================================================

            pendingDispatchPayload = {

                action:
                    "dispatch-review",

                user:
                    sessionStorage.getItem(
                        "employee"
                    ) || "",

                warehouse:
                    sessionStorage.getItem(
                        "warehouse"
                    ) || "",

                invoiceNo:
                    invoiceNo,

                items:
                    finalItems,

                validation: {

                    passed:
                        false,

                    expectedItems:
                        expectedItems,

                    extractedItems:
                        extractedItems,

                    expectedQty:
                        expectedQty,

                    extractedQty:
                        extractedQty,

                    errors:
                        validationErrors,

                    suspiciousItems:
                        suspiciousItems

                }

            };


            input.value = "";

            return;

        }


        // ========================================================
        // EVERYTHING VERIFIED
        // ========================================================

        pendingDispatchPayload = {

            action:
                "dispatch",

            user:
                sessionStorage.getItem(
                    "employee"
                ) || "",

            warehouse:
                sessionStorage.getItem(
                    "warehouse"
                ) || "",

            invoiceNo:
                invoiceNo,

            items:
                finalItems,

            validation: {

                passed:
                    true,

                expectedItems:
                    expectedItems,

                extractedItems:
                    extractedItems,

                expectedQty:
                    expectedQty,

                extractedQty:
                    extractedQty

            }

        };


        // ========================================================
        // SUCCESS MESSAGE
        // ========================================================

        alert(

            "✅ Invoice successfully verified.\n\n" +

            `Invoice: ${invoiceNo}\n` +

            `Items: ${extractedItems}\n` +

            `Total Qty: ${extractedQty}\n\n` +

            "All validation checks passed."

        );


        // ========================================================
        // EXISTING CONFIRMATION MODAL
        // ========================================================

        openDispatchConfirmationModal();


    } catch (err) {

        console.error(
            "MARG PDF Parser Error:",
            err
        );


        alert(

            "❌ PDF Parsing Error\n\n" +

            err.message

        );

    } finally {

        input.value = "";

    }

}

      let itemsRows = pendingDispatchPayload.items.map((item, idx) => `
        <tr>
          <td><b>${escapeHtml(item.product)}</b></td>
          <td>
            <input type="text" id="edit_d_batch_${idx}" value="${escapeHtml(item.batch)}" style="width: 100px; padding: 6px; font-size: 0.85rem; text-transform: uppercase; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; background: #fff;">

            <div style="display:flex; gap:12px; margin-top:8px;">
              <button onclick="confirmAndProceedDispatch()" class="btn-success">Yes, Proceed</button>
              <button onclick="closeModalAndResume()" class="btn-danger">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    async function confirmAndProceedDispatch() {
      if (!pendingDispatchPayload) return;
      
      let items = pendingDispatchPayload.items;
      for (let i = 0; i < items.length; i++) {
        let newBatch = document.getElementById("edit_d_batch_" + i).value.trim();
        let newBilled = parseInt(document.getElementById("edit_d_billed_" + i).value, 10) || 0;
        let newFree = parseInt(document.getElementById("edit_d_free_" + i).value, 10) || 0;
        
        if (!newBatch) {
          alert("Batch number cannot be empty for " + items[i].product);
          return;
        }
        
        items[i].batch = newBatch.toUpperCase();
        items[i].billedQty = newBilled;
        items[i].freeQty = newFree;
        items[i].qty = newBilled + newFree;
      }

      let confirmBtn = document.querySelector("#modal-container button.btn-success");
      if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Processing..."; }

      try {
        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(pendingDispatchPayload)
        });
        
        let text = await response.text();
        
        if (text.includes("<!DOCTYPE") || text.includes("<html")) {
            throw new Error("Google blocked the request! Please deploy your Apps Script again with 'Who has access' set to 'Anyone'.");
        }

        let resData = JSON.parse(text);

        if (resData.status === "success") {
          alert("✅ Bill Proceed Successfully");
          pendingDispatchPayload = null;
          closeModalAndResume();
          syncDataAndShowDashboard();
        } else {
          alert("❌ REJECTED:\n\n" + resData.message);
          closeModalAndResume();
        }
      } catch (err) {
        alert("⚠️ " + err.message);
        if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.innerText = "Yes, Proceed"; }
      }
    }

0 DT TAB 1*10", "HATPOD 200 DT TAB 1*10", "HATPOD-100 D/S 30 ml", "HATPOD-200 TAB 1*10", "HATPYRIN SYP 60 ML", "HATPYRIN TAB 1*10", "HATVET'S ALL IN ONE SHAMPOO 200 ML", "HATVET'S ANTI DANDRUFF SHAMPOO 200 ML", "HATVET'S ALL IN ONE SHAMPOO 30 ML", "HATVET'S DRY FOAM SHAMPOO 150 ML", "HATVET'S HATGROOM POWDER 100 GM", "HATVIT-A TAB 1*10", "VITnMIN-H TAB 1*10", "HATWORM KITTY TAB 1*1", "HATWORM PLUS TAB. 1*2", "HATZAPINE TAB 1*10", "HATZINE-25 1*10", "HATZINE-50 1*10", "HEPARAJ ADVANCE TAB 1*10", "HEPARAJ JUNIOR SYRUP 100 ML", "HEPARAJ PLUS TAB. 1*10", "HEPARAJ TAB 1*10", "IMMUNOHAT SYP 100 ML", "INFLAHAT-TBR TAB 1*10", "ITRARAJ SYP 60 ml", "ITRARAJ-100MG TAB 1*10", "IVERRAJ-10MG TAB. 1*10", "IVERRAJ-3MG TAB. 1*10", "IVERRAJ-DT 16 TAB 1*10", "KETOHAT 200 MG TAB. 1*10", "METROHAT 300 MG TAB 1*10", "METROHAT SYP 60 ml", "NASOVET NASAL DROP 10 ml", "ONDAHAT ORAL SPRAY 20 ML", "ONDAHAT ORAL SPRAY 30ML", "OPTHORAJ-DT EYE DROP 5 ml", "OTIHAT TeN EAR CLEANSER 50 ML", "OTIHAT-EC 60 ML", "PANTOHAT 40 TAB. 1*10", "PANTOHAT-D TAB. 1*10", "PANTOHAT-I.V. INJ. 10ML", "PULMOHAT SYRUP 100 ML", "RAJCPM SYP 60 ml", "RAJDOX 100 INJ. 100 MG", "RAJDOX 200 INJ. 200 MG", "RAJDOX SUSP 60 ml", "RAJDOX-100 TAB 1*10", "RAJDOX-200 TAB 1*10", "RAJDOX-LB 100 1*10", "RAJDOX-LB 200 1*10", "RAJDOX-LB 300 TAB 1*10", "RAJDROXIL-500 DT TAB 1*10", "RAJDROXIL-250 TAB 1*10", "RAJDROXIL-600 DT TAB 1*10", "RAJFAN TAB 1*3", "RAJFAN-50 SYRUP 60 ML", "RAJMET SYP 60 ml", "RAJMET-DP SYRUP 60 ML", "RAJPARA SUSP 60 ml", "RAJPARA TAB 1*10", "RANTIRAJ SYP 100 ml", "RANTIRAJ TAB 1*10", "RENALRAJ SUSP 170 ml", "RENOHAT PLUS TABLET 1*30", "RENOHAT-H SYRUP 100 ML", "SCABHAT OINTMENT 30 GM", "TERBIRAJ 250 TAB 1*10", "TERBIRAJ 500 TAB 1*10", "TORSOHAT 7.5 TAB 1*10", "TRAMAHAT 100 DT TAB 1*10", "TRAMAHAT 50 DT TAB 1*10", "VETAXONE-SL INJ. 750 MG", "VETAXONE-TAZO INJ. 562.5", "VETTAX-SL INJ. 750 MG"
        ];

        const normalize = value => String(value || "").toUpperCase().replace(/₹/g, "").replace(/[‐-‒–—]/g, "-").replace(/\s+/g, " ").trim();
        const alphaNum = value => normalize(value).replace(/[^A-Z0-9]/g, "");

        const PRODUCT_MAP = PRODUCT_OPTIONS.map(name => ({
            full: name, norm: normalize(name), base: alphaNum(name)
        })).sort((a, b) => b.base.length - a.base.length);

        const isNumber = value => /^[+-]?\d+(?:,\d{3})*(?:\.\d+)?$/.test(String(value || "").trim());
        const numberValue = value => isNumber(value) ? Number(String(value).replace(/,/g, "").trim()) : null;
        const isDateLike = value => /^\d{1,2}[\/-]\d{2,4}$/.test(String(value || "").trim());
        const distance = (a, b) => (a === null || b === null) ? 99999 : Math.abs(a - b);

        const pages = {};
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            const page = await pdf.getPage(pageNo);
            const content = await page.getTextContent();
            pages[pageNo] = content.items.map((item, index) => ({
                str: String(item.str || "").trim(),
                x: Number(item.transform?.[4] || 0),
                y: Number(item.transform?.[5] || 0),
                index, page: pageNo
            })).filter(item => item.str);
        }

        let allText = Object.values(pages).flat().map(x => x.str).join(" ");
        let invoiceMatch = allText.match(/Invoice\s*No\.?\s*[:\-]?\s*([A-Z0-9\-]+)/i) || allText.match(/CN[0-9]+/i);
        const invoiceNo = invoiceMatch ? (invoiceMatch[1] || invoiceMatch[0]) : "RET-" + Math.floor(Math.random() * 10000);

        const pageHeaders = {};
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            pageHeaders[pageNo] = { serial: null, qty: null, free: null, batch: null, exp: null, mrp: null };
            for (const item of pages[pageNo]) {
                const t = normalize(item.str).replace(/\s+/g, "");
                if (t === "SN." || t === "SN" || t === "S.NO." || t === "SNO.") pageHeaders[pageNo].serial = item.x;
                if (t === "QTY" || t === "QTY.") pageHeaders[pageNo].qty = item.x;
                if (t === "FREE" || t === "FREE." || t === "FREE..") pageHeaders[pageNo].free = item.x;
                if (t === "BATCH" || t === "BATCHNO" || t === "BATCHNO." || t === "BATCHNO:") pageHeaders[pageNo].batch = item.x;
                if (t === "EXP" || t === "EXP.") pageHeaders[pageNo].exp = item.x;
                if (t === "M.R.P" || t === "MRP" || t === "M.R.P.") pageHeaders[pageNo].mrp = item.x;
            }
        }

        let previousHeaders = { serial: null, qty: null, free: null, batch: null, exp: null, mrp: null };
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            Object.keys(pageHeaders[pageNo]).forEach(key => {
                if (pageHeaders[pageNo][key] === null) pageHeaders[pageNo][key] = previousHeaders[key];
                else previousHeaders[key] = pageHeaders[pageNo][key];
            });
        }

        const rows = [];
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            const sorted = [...pages[pageNo]].sort((a, b) => Math.abs(a.y - b.y) < 2 ? a.x - b.x : b.y - a.y);
            const pageRows = [];
            for (const item of sorted) {
                let row = pageRows.find(r => Math.abs(r.y - item.y) <= 2.8);
                if (!row) { row = { page: pageNo, y: item.y, items: [] }; pageRows.push(row); }
                row.items.push(item);
            }
            pageRows.sort((a, b) => b.y - a.y);
            rows.push(...pageRows);
        }

        const serialRows = [];
        for (const row of rows) {
            const rowText = row.items.map(x => x.str).join(" ");
            const strictMatch = rowText.match(/^\s*(\d{1,4})\s*[.)](?!\d)/);
            const looseMatch = rowText.match(/^\s*(\d{1,4})\b/);
            let serial = null;

            if (strictMatch) serial = parseInt(strictMatch[1], 10);
            else if (looseMatch) {
                const rowAlphaNum = alphaNum(rowText);
                if (PRODUCT_MAP.some(p => rowAlphaNum.includes(p.base))) serial = parseInt(looseMatch[1], 10);
            }

            if (serial !== null && serial >= 1 && serial <= 200) {
                serialRows.push({ ...row, serial });
            }
        }

        const ignoredWords = ["CLASS TOTAL", "TOTAL", "GST", "IGST", "TERMS", "GRAND TOTAL", "TAXABLE AMT", "DIS AMT", "PAYBLE", "SUMMARY"];
        const isIgnoredRow = text => ignoredWords.some(word => normalize(text).includes(word));

        function findProduct(rowItems) {
            const combined = rowItems.map(x => x.str).join(" ");
            const combinedBase = alphaNum(combined);
            for (const p of PRODUCT_MAP) { if (combinedBase.includes(p.base)) return { product: p.full, confidence: 1 }; }
            
            const tokens = normalize(combined).split(/\s+/).filter(Boolean);
            let best = null;
            for (const p of PRODUCT_MAP) {
                const pTokens = p.norm.split(/\s+/);
                let matched = 0;
                for (const token of pTokens) {
                    if (token.length >= 3 && tokens.some(t => t === token || t.includes(token) || token.includes(t))) matched++;
                }
                const score = matched / Math.max(pTokens.length, 1);
                if (score >= 0.65 && (!best || score > best.score)) best = { product: p.full, confidence: score };
            }
            return best;
        }

        let itemsFound = [];
        let currentDate = new Date();

        for (const row of serialRows) {
            const rowText = row.items.map(x => x.str).join(" ");
            if (isIgnoredRow(rowText)) continue;

            const headers = pageHeaders[row.page];
            const productResult = findProduct(row.items);

            if (!productResult) continue;

            const numeric = row.items.map(item => ({ ...item, value: numberValue(item.str) })).filter(item => item.value !== null);

            let billedQty = 0, freeQty = 0;
            
            let qtyFreeCandidates = numeric.filter(item => 
                (headers.qty === null || item.x >= headers.qty - 20) && 
                (headers.batch === null || item.x < headers.batch - 10)
            );

            qtyFreeCandidates.forEach(item => {
                let distQty = headers.qty !== null ? Math.abs(item.x - headers.qty) : 9999;
                let distFree = headers.free !== null ? Math.abs(item.x - headers.free) : 9999;

                if (distQty <= 35 && distQty < distFree) {
                    billedQty = item.value;
                } else if (distFree <= 30 && distFree < distQty) {
                    freeQty = item.value;
                }
            });

            if (billedQty === 0 && headers.qty === null) {
                const productX = row.items.find(item => alphaNum(item.str).includes(alphaNum(productResult.product)))?.x ?? 0;
                const afterProduct = numeric.filter(item => item.x > productX).sort((a, b) => a.x - b.x);
                if (headers.free === null && afterProduct.length) {
                    billedQty = afterProduct[0].value;
                }
            }

            let batch = "";
            const batchCandidates = row.items.filter(item => !isDateLike(item.str) && item.str.toUpperCase() !== productResult.product.toUpperCase() && item.str.trim().length >= 3)
                .map(item => ({ ...item, distance: distance(item.x, headers.batch) }))
                .sort((a, b) => a.distance - b.distance);
            if (batchCandidates.length && batchCandidates[0].distance <= 55) batch = batchCandidates[0].str.trim();

            let exp = "";
            const expiryCandidates = row.items.filter(item => isDateLike(item.str)).map(item => ({ ...item, distance: distance(item.x, headers.exp) })).sort((a, b) => a.distance - b.distance);
            if (expiryCandidates.length) exp = expiryCandidates[0].str.trim();

            let mrp = "0.00";
            const mrpCandidates = row.items.filter(item => /^\d+\.\d{2}$/.test(item.str.trim().replace(/,/g, '')))
                .map(item => ({ ...item, distance: distance(item.x, headers.mrp) })).sort((a, b) => a.distance - b.distance);
            if (mrpCandidates.length && mrpCandidates[0].distance <= 45) mrp = mrpCandidates[0].str.trim().replace(/,/g, '');

            let formattedExpDate = parsePdfExpiryToDate(exp);
            let statusText = "Usable", statusClass = "color:var(--success); font-weight:700;";
            if (formattedExpDate) {
                let expDateObj = new Date(formattedExpDate);
                let daysDiff = Math.ceil((expDateObj.getTime() - currentDate.getTime()) / (1000 * 3600 * 24));
                if (daysDiff <= 90) { statusText = "Expired"; statusClass = "color:var(--danger); font-weight:700;"; }
            }

            itemsFound.push({
		serial: row.serial,       // Add this line
                page: row.page,           // Add this line
                rawText: rowText,         // Add this line
                product: productResult.product,
                batch: batch || "UNKNOWN",
                billedQty: billedQty,
                freeQty: freeQty,
                qty: Number(billedQty) + Number(freeQty),
                exp: exp || "01/30",
                mrp: mrp,
                expDate: formattedExpDate,
                status: statusText,
                statusClass: statusClass
            });
        }

        const uniqueRows = [];
        const physicalRowKeys = new Set();
        for (const item of itemsFound) {
            const key = `${item.page}|${item.serial}|${item.rawText}`;
            if (physicalRowKeys.has(key)) continue;
            physicalRowKeys.add(key);
            uniqueRows.push(item);
        }

        if (uniqueRows.length === 0) {
            alert("⚠️ Failed to read valid product items from Return PDF. Please ensure it's a standard Marg ERP Credit Note.");
            input.value = "";
            return;
        }

        pendingDispatchReturnPayload = {
            action: "dispatch_return",
            user: sessionStorage.getItem("employee") || "",
            warehouse: sessionStorage.getItem("warehouse") || "",
            invoiceNo: invoiceNo,
            items: uniqueRows
        };

        alert(
            "✅ CN Invoice successfully verified.\n\n" +
            `CN Invoice: ${invoiceNo}\n` +
            `Items: ${uniqueRows.length}\n` +
            `Total Qty: ${uniqueRows.reduce((sum, item) => sum + Number(item.qty || 0), 0)}\n\n` +
            "All validation checks passed."
        );

        openDispatchReturnConfirmationModal();

    } catch (err) {
        console.error("MARG PDF Parser Error:", err);
        alert("❌ PDF Parsing Error\n\n" + err.message);
    } finally {
        input.value = "";
    }
}

    function parsePdfExpiryToDate(expStr) {
      if (!expStr || !expStr.includes("/")) return "2030-01-01";
      let parts = expStr.replace(/\$/g, '').split("/");
      let month = parts[0].padStart(2, '0');
      let year = parts[1];
      if (year.length === 2) { year = "20" + year; }
      return `${year}-${month}-01`;
    }
    
    function updateRowStatus(idx) {
      let expVal = document.getElementById("edit_r_exp_" + idx).value;
      let formattedExpDate = parsePdfExpiryToDate(expVal);
      let statusText = "Usable";
      let statusClass = "color:var(--success); font-weight:700;";
      if (formattedExpDate) {
        let expDateObj = new Date(formattedExpDate);
        let currentDate = new Date();
        let timeDiff = expDateObj.getTime() - currentDate.getTime();
        let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
        if (daysDiff <= 90) {
           statusText = "Expired";
           statusClass = "color:var(--danger); font-weight:700;";
        }
      }
      let statusSpan = document.getElementById("status_span_" + idx);
      if(statusSpan) {
        statusSpan.innerText = statusText;
        statusSpan.setAttribute("style", statusClass);
      }
    }

    async function confirmAndExecuteDispatchReturn() {
      if (!pendingDispatchReturnPayload) return;
      
      let items = pendingDispatchReturnPayload.items;
      let currentDate = new Date();

      for (let i = 0; i < items.length; i++) {
        let newBatch = document.getElementById("edit_r_batch_" + i).value.trim();
        let newExp = document.getElementById("edit_r_exp_" + i).value.trim();
        let newBilled = parseInt(document.getElementById("edit_r_billed_" + i).value, 10) || 0;
        let newFree = parseInt(document.getElementById("edit_r_free_" + i).value, 10) || 0;
        let newMrp = document.getElementById("edit_r_mrp_" + i).value.trim() || "0.00";
        
        if (!newBatch) {
          alert("Batch number cannot be empty for " + items[i].product);
          return;
        }

        let formattedExpDate = parsePdfExpiryToDate(newExp);
        let statusText = "Usable";
        let statusClass = "color:var(--success); font-weight:700;";

        if (formattedExpDate) {
          let expDateObj = new Date(formattedExpDate);
          let timeDiff = expDateObj.getTime() - currentDate.getTime();
          let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
          if (daysDiff <= 90) {
             statusText = "Expired";
             statusClass = "color:var(--danger); font-weight:700;";
          }
        }
        
        items[i].batch = newBatch.toUpperCase();
        items[i].exp = newExp;
        items[i].billedQty = newBilled;
        items[i].freeQty = newFree;
        items[i].qty = newBilled + newFree;
        items[i].mrp = newMrp;
        items[i].expDate = formattedExpDate;
        items[i].status = statusText;
        items[i].statusClass = statusClass;
      }

      let confirmBtn = document.querySelector("#modal-container button.btn-success");
      if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Processing Return..."; }

      try {
        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(pendingDispatchReturnPayload)
        });
        
        let text = await response.text();
        
        if (text.includes("<!DOCTYPE") || text.includes("<html")) {
            throw new Error("Google blocked the request! Please deploy your Apps Script again with 'Who has access' set to 'Anyone'.");
        }

        let resData = JSON.parse(text);

        if (resData.status === "success") {
          alert("✅ " + resData.message);
          pendingDispatchReturnPayload = null;
          closeModalAndResume();
          syncDataAndShowDashboard();
        } else {
          alert("❌ ERROR:\n\n" + resData.message);
          closeModalAndResume();
        }
      } catch (err) {
        alert("⚠️ Connection Error: " + err.message);
        if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.innerText = "Confirm & Sync"; }
      }
    }

	function getSuspenseExpiryMonthsDiff(expStr) {
      if (!expStr) return null;
      let cleanStr = expStr.trim().replace(/\$/g, '');
      let match = cleanStr.match(/^(0?[1-9]|1[0-2])[\/\-](\d{2}|\d{4})$/);
      if (!match) return null;

      let expMonth = parseInt(match[1], 10);
      let expYear = parseInt(match[2], 10);
      if (expYear < 100) expYear += 2000;

      let now = new Date();
      let currentYear = now.getFullYear();
      let currentMonth = now.getMonth() + 1; // 1 to 12

      let monthsDiff = (expYear - currentYear) * 12 + (expMonth - currentMonth);
      let formattedExp = String(expMonth).padStart(2, '0') + "/" + String(expYear).slice(-2);
      let isoExpDate = `${expYear}-${String(expMonth).padStart(2, '0')}-01`;

      return { monthsDiff, formattedExp, isoExpDate };
    }

    function updateSuspenseStatus() {
      let expVal = document.getElementById("sr_exp").value.trim();
      let statusBox = document.getElementById("sr_status_box");
      let daysText = document.getElementById("sr_days_text");
      
      let parsed = getSuspenseExpiryMonthsDiff(expVal);
      
      if (!parsed) {
         statusBox.innerText = "Pending";
         statusBox.style.color = "var(--text-muted)";
         daysText.innerText = expVal.length >= 4 ? "Invalid format (Use MM/YY)" : "";
         return;
      }

      let mDiff = parsed.monthsDiff;

      if (mDiff <= 0) {
         statusBox.innerText = "Expired";
         statusBox.style.color = "var(--danger)";
         daysText.innerText = mDiff === 0 ? "Expires this month (➔ Expired Inventory)" : `Expired ${Math.abs(mDiff)} month(s) ago (➔ Expired Inventory)`;
      } else if (mDiff <= 9) {
         statusBox.innerText = "Near-Expiry";
         statusBox.style.color = "var(--warning)";
         daysText.innerText = `${mDiff} Month(s) remaining (➔ Near-Expiry Inventory)`;
      } else {
         statusBox.innerText = "Usable";
         statusBox.style.color = "var(--success)";
         daysText.innerText = `${mDiff} Month(s) remaining (➔ QA Inventory)`;
      }
    }

    async function submitSalesReturnSuspense() {
      let product = document.getElementById("sr_product").value.trim();
      let batch = document.getElementById("sr_batch").value.trim();
      let exp = document.getElementById("sr_exp").value.trim();
      let qty = parseInt(document.getElementById("sr_qty").value, 10) || 0;
      let free = parseInt(document.getElementById("sr_free").value, 10) || 0;
      let mrp = document.getElementById("sr_mrp").value.trim() || "0.00";

      if (!product || !batch || !exp || (qty + free) <= 0) {
        alert("Please fill Product Name, Batch, Exp Date, and ensure Qty + Free is greater than 0!");
        return;
      }

      let parsedExp = getSuspenseExpiryMonthsDiff(exp);
      if (!parsedExp) {
        alert("❌ Invalid Exp. Date! Please enter in MM/YY format (e.g., 08/26 or 12/27).");
        return;
      }

      let submitBtn = document.querySelector("#modal-container button.btn-success");
      if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Submitting..."; }

      let payload = {
        action: "sales_return_suspense",
        user: sessionStorage.getItem("employee") || "",
        warehouse: sessionStorage.getItem("warehouse") || "",
        product: product.toUpperCase(),
        batch: batch.toUpperCase(),
        exp: parsedExp.formattedExp,
        expDate: parsedExp.isoExpDate,
        qty: qty,
        free: free,
        mrp: mrp
      };

      try {
        const response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const resData = JSON.parse(await response.text());

        if (resData.status === "success") {
          alert("✅ " + resData.message);
          closeModalAndResume();
          syncDataAndShowDashboard();
        } else {
          alert("❌ Error: " + resData.message);
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit Entry"; }
        }
      } catch (e) {
        alert("⚠️ Error: " + e.message);
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit Entry"; }
      }
    }

    async function loadShortItemList() {
      let container = document.getElementById('short-item-container'); 
      container.innerHTML = "<div style='text-align:center; padding: 20px;'><i class='fa-solid fa-spinner fa-spin'></i> <b>Loading Short Items...</b></div>";
      
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=shortItems`);
        let items = await response.json();
        
        items = items.filter(item => item.qty > 0);

        let html = '';
        if(!items || items.length === 0) {
          html = "<div style='text-align:center; padding: 15px; background: #d1e7dd; color: #0f5132; border-radius: 6px;'>All items have sufficient stock (1000 or more) or are empty.</div>";
        } else {
          let rows = items.map(item => `
            <tr>
              <td style="padding:10px; border:1px solid var(--border-color);"><b>${escapeHtml(item.productName)}</b></td>
              <td style="padding:10px; border:1px solid var(--border-color); color: var(--danger); font-weight: bold;">${formatNumber(item.qty)}</td>
              <td style="padding:10px; border:1px solid var(--border-color);">${escapeHtml(item.location)}</td>
            </tr>
          `).join("");

          html = `<table class="pdf-item-table" style="width:100%; border-collapse:collapse;">
                    <thead>
                      <tr>
                        <th style="padding:10px; border:1px solid var(--border-color);">Product Name</th>

                        <th style="padding:10px; border:1px solid var(--border-color);">Warehouse Location</th>
                      </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>`;
        }
        container.innerHTML = html;
      } catch (error) {
         console.error(error);
         container.innerHTML = "<div style='text-align:center; padding: 15px; background: #f8d7da; color: #842029; border-radius: 6px;'>Error loading data.</div>";
      }
    }

	// --- 3. UNIFIED RENDER FUNCTION (Dono Reports ke liye ek hi UI) ---
function renderFullStockReport(data, reportType = "Full") {
  let groupedData = {};
  
  if (data && data.length > 0) {
    data.forEach(item => {
      let shortExp = item.exp ? formatShortDate(item.exp.toString()) : "";
      let loc = item.location ? item.location.toString().trim() : "N/A";
      let prod = item.product ? item.product.toString().trim() : "N/A";
      let batch = item.batch ? item.batch.toString().trim() : "N/A";
      let mrp = item.mrp ? item.mrp.toString().trim() : "0.00";
      let sup = item.supplier ? item.supplier.toString().trim() : "N/A"; 
      
      let key = loc + "|" + prod + "|" + batch + "|" + shortExp + "|" + mrp + "|" + sup;
      
      if (!groupedData[key]) {
        groupedData[key] = { location: loc, product: prod, batch: batch, supplier: sup, exp: shortExp, mrp: mrp, qty: 0 };
      }
      
      let itemQty = parseFloat(String(item.qty).replace(/,/g, '')) || 0;
      groupedData[key].qty += itemQty;
    });
  }
  
  let aggregatedArray = Object.values(groupedData).filter(item => item.qty > 0);
  aggregatedArray.sort((a, b) => a.product.localeCompare(b.product));
  
  AppState.stockData = aggregatedArray; 

  let tbody = "";
  if (aggregatedArray.length === 0) {
    tbody = `<tr><td colspan="8" style="text-align:center; padding: 20px;">No stock available</td></tr>`;
  } else {
    tbody = aggregatedArray.map((item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td>${escapeHtml(item.location)}</td>
        <td>${escapeHtml(item.supplier)}</td> <!-- Supplier Name yaha shift kiya -->
        <td><b>${escapeHtml(item.product)}</b></td>
        <td>${escapeHtml(item.batch)}</td>
        <td>${escapeHtml(item.exp)}</td>
        <td style="text-align:right; font-weight:bold; color:var(--primary);">${formatNumber(item.qty)}</td>
        <td>${escapeHtml(item.mrp)}</td>
      </tr>
    `).join("");
  }

  let title = reportType === "Full" ? "Full Stock Report" : `Current Stock: ${escapeHtml(reportType)}`;

  document.getElementById("modal-container").innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box" style="max-width: 1050px; max-height: 90vh; overflow-y: auto;">
        <button onclick="closeModalAndResume()" class="modal-close-btn" title="Close"><i class="fa-solid fa-xmark"></i></button>
        <h3 style="color:var(--primary);"><i class="fa-solid fa-chart-column"></i> ${title}</h3>
        <div style="display:flex; justify-content:space-between; margin-top:8px;">
          <button onclick="downloadStockExcel('${escapeHtml(reportType)}')" class="btn-emerald" style="width:auto; padding:8px 16px;"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
          <button onclick="openStockReportModal()" class="btn-secondary" style="width:auto; padding:8px 16px;"><i class="fa-solid fa-arrow-left"></i> Back</button>
        </div>
        <table class="pdf-item-table" style="margin-top:16px; font-size: 0.8rem;">
          <thead>
            <tr>
              <th style="width: 5%;">Sr.No</th>
              <th>Location</th>
              <th>Supplier Name</th> <!-- Supplier Name yaha shift kiya -->
              <th>Product Name</th>
              <th>Batch No.</th>
              <th>Expiry Date</th>
              <th style="text-align:right;">Available Qty</th>
              <th>MRP</th>
            </tr>
          </thead>
          <tbody>
            ${tbody}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// --- 4. UNIFIED EXCEL EXPORT ---
function downloadStockExcel(type) {
  try {
    if (!AppState.stockData || AppState.stockData.length === 0) {
      alert("No data available to export.");
      return;
    }
    
    // Excel me column order aapke naye format ke hisaab se update kiya
    let exportData = AppState.stockData.map((item, idx) => ({
      "Sr.No": idx + 1,
      "Location": item.location || "N/A",
      "Supplier Name": item.supplier || "N/A", 
      "Product Name": item.product || "N/A",
      "Batch No.": item.batch || "N/A",
      "Expiry Date": item.exp || "N/A",
      "Available Qty": parseInt(item.qty) || 0,
      "MRP": item.mrp || "N/A"
    }));

    let ws = XLSX.utils.json_to_sheet(exportData);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Stock Report");
    
    let fileName = type === "Full" ? "Full_Stock_Report" : `Stock_${type.replace(/[^a-zA-Z0-9]/g, '_')}`;
    let dateStr = new Date().toISOString().slice(0, 10);
    
    XLSX.writeFile(wb, `${fileName}_${dateStr}.xlsx`);
  } catch (err) {
    console.error("Export Error: ", err);
    alert("Export failed: " + err.message);
  }
}

    function searchSopManual() {
      let q = (document.getElementById("sopSearchInput")?.value || "").toLowerCase().trim();
      document.querySelectorAll("#sopModalBody .sop-section-block").forEach(sec => {
        let hasVisibleCard = false;
        sec.querySelectorAll(".sop-card").forEach(card => {
          if (!q || card.innerText.toLowerCase().includes(q)) {
            card.style.display = "flex";
            hasVisibleCard = true;
          } else {
            card.style.display = "none";
          }
        });
        sec.style.display = hasVisibleCard ? "flex" : "none";
      });
    }

    async function executeInlineCOAUpload(rowIdx) {
      let fileInput = document.getElementById(`inline_coa_${rowIdx}`);
      if (!fileInput || fileInput.files.length === 0) return;
      
      let file = fileInput.files[0];
      if (file.size > 5 * 1024 * 1024) { alert(`File too large. Max 5MB allowed.`); return; }
      
      let btn = fileInput.nextElementSibling;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading...`;

      try {
        let base64Full = await readFileAsBase64(file);
        let payload = {
          action: "uploadPendingCOA",
          rowIdx: rowIdx,
          coa: { filename: file.name, mimeType: file.type, base64: base64Full.split(",")[1] }
        };

        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        
        let resData = JSON.parse(await response.text());
        if (resData.status === "success") {
           alert("✅ COA Uploaded and saved to Server!");
           let rowElement = document.getElementById(`pending_row_${rowIdx}`);
           if (rowElement) rowElement.remove();
        } else {
           alert("❌ Upload Error: " + resData.message);
           btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-upload"></i> Retry Upload`;
        }
      } catch(e) {
        alert("Upload Failed: " + e.message);
        btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-upload"></i> Retry Upload`;
      }
    }

    function exportAnalyzerExcel() {
      if (!analyzerDataCache || !analyzerDataCache.items || analyzerDataCache.items.length === 0) {
        alert("No data available to export.");
        return;
      }

      let btn = document.querySelector("#modal-container .btn-emerald");
      if (btn) btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Exporting...";

      try {
        let headers = analyzerDataCache.headers;
        let exportData = analyzerDataCache.items.map((item, idx) => {
          let displayTag = item.tag === "High Moving" ? "High Demand" : (item.tag === "Medium Moving" ? "Stable Demand" : "Low Demand");
          
          return {
            "Sr. No": idx + 1,
            "Product Name": item.product,
            "Current Stock": item.stock,
            "Total Sold": item.totalSold,
            "% of Total Sales": item.perc + "%",
            "Classification Tag": displayTag,
            "Trend Pattern": item.trend,
            [headers.m3 + " (Month -3)"]: item.m3,
            [headers.m2 + " (Month -2)"]: item.m2,
            [headers.m1 + " (Current Month)"]: item.m1
          };
        });

        let ws = XLSX.utils.json_to_sheet(exportData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "ABC Analysis");
        XLSX.writeFile(wb, `Product_Analyzer_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
        
        if (btn) btn.innerHTML = "<i class='fa-solid fa-file-excel'></i> Export to Excel";
      } catch (e) {
        alert("Export Error: " + e.message);
        if (btn) btn.innerHTML = "<i class='fa-solid fa-file-excel'></i> Export to Excel";
      }
    }

	async function openDumpInventoryModal() {

          </div>
        </div>
      `;

      try {
        let res = await safeFetch(`${GOOGLE_SHEET_URL}?action=getDamagedDumpData`);
        if (res && res.status === "error") throw new Error(res.message);

        // Raw Data Excel Export ke liye globally save kar rahe hain (Isko change nahi kiya hai)
        window.currentDumpData = res;

        let tbody = "";
        if (!res || res.length === 0) {
          tbody = `<tr><td colspan="2" style="text-align:center; padding: 20px; color: var(--text-muted);">No records found in Damaged Dump.</td></tr>`;
        } else {
          
          // GROUPING LOGIC (UI ke liye 1 Product 1 Baar aayega or Qty Plus ho jayegi)
          let groupedData = {};
          res.forEach(item => {
            let p = item.product;
            if(!groupedData[p]) {
              groupedData[p] = {
                product: p,
                qty: 0
              };

          // Object to array & Alphabetical Sort

          // Screen par sirf Product aur Qty show karenge
          aggregatedArray.forEach((item) => {
             tbody += `

                 <td><b>${escapeHtml(item.product)}</b></td>
                 <td style="text-align: right; color: var(--danger); font-weight: bold;">${formatNumber(item.qty)}</td>

    function parseExpiryMonthYear(rawExp) {
      if (!rawExp) return null;
      let str = String(rawExp).trim();
      if (!str) return null;

      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      // 1. Google Sheet Long Date String (e.g., "Thu Oct 01 2026 00:00:00 GMT+0530...")
      if (str.includes("GMT") || str.includes("Standard Time") || str.length > 20) {
        let d = new Date(str);
        if (!isNaN(d.getTime())) {
          let m = d.getMonth() + 1;
          let y = d.getFullYear();
          return { month: m, year: y, formatted: `${monthNames[m - 1]}-${String(y).slice(-2)}` };
        }
      }

      // 2. Format: MM/YY or MM/YYYY or MM-YY or MM-YYYY (e.g., 07/26, 08/26, 08/2026)
      let mmYY = str.match(/^(\d{1,2})[\/\-](\d{2}|\d{4})$/);
      if (mmYY) {
        let m = parseInt(mmYY[1], 10);
        let y = parseInt(mmYY[2], 10);
        if (y < 100) y += 2000;
        if (m >= 1 && m <= 12) {
          return { month: m, year: y, formatted: `${monthNames[m - 1]}-${String(y).slice(-2)}` };
        }
      }

      // 3. Format: DD-MMM-YY or DD-MMM-YYYY (e.g., 01-Sep-29, 01-Jul-26)
      let ddMonYY = str.match(/^(\d{1,2})[\s\/\-]+([a-zA-Z]+)[\s\/\-]+(\d{2}|\d{4})$/);
      if (ddMonYY) {
        let monPrefix = ddMonYY[2].substring(0, 3).toLowerCase();
        let mIdx = monthNames.findIndex(m => m.toLowerCase() === monPrefix);
        if (mIdx !== -1) {
          let m = mIdx + 1;
          let y = parseInt(ddMonYY[3], 10);
          if (y < 100) y += 2000;
          return { month: m, year: y, formatted: `${monthNames[m - 1]}-${String(y).slice(-2)}` };
        }
      }

      // 4. Format: YYYY-MM-DD (e.g., 2026-10-01)
      let ymd = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if (ymd) {
        let y = parseInt(ymd[1], 10);
        let m = parseInt(ymd[2], 10);
        if (m >= 1 && m <= 12) {
          return { month: m, year: y, formatted: `${monthNames[m - 1]}-${String(y).slice(-2)}` };
        }
      }

      // 5. Format: DD-MM-YYYY or DD/MM/YYYY
      let dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (dmy) {
        let m = parseInt(dmy[2], 10);
        let y = parseInt(dmy[3], 10);
        if (m >= 1 && m <= 12) {
          return { month: m, year: y, formatted: `${monthNames[m - 1]}-${String(y).slice(-2)}` };
        }
      }

      // 6. Format: Oct-26, October-26, Aug 2026, Jul/26
      let monYY = str.match(/^([a-zA-Z]+)[\s\/\-]+(\d{2}|\d{4})$/);
      if (monYY) {
        let monPrefix = monYY[1].substring(0, 3).toLowerCase();
        let mIdx = monthNames.findIndex(m => m.toLowerCase() === monPrefix);
        if (mIdx !== -1) {
          let m = mIdx + 1;
          let y = parseInt(monYY[2], 10);
          if (y < 100) y += 2000;
          return { month: m, year: y, formatted: `${monthNames[m - 1]}-${String(y).slice(-2)}` };
        }
      }

      return null;
    }

    async function checkExpiredStockNotifications(preloadedData) {
      try {
        const currentWh = (sessionStorage.getItem("warehouse") || "").trim();
        const userRole = (sessionStorage.getItem("role") || "Standard").trim().toLowerCase();
        const lowerWh = currentWh.toLowerCase();

        const isGlobalUser = (
          userRole === "admin" || 
          userRole === "master user" || 
          userRole.includes("view") || 
          userRole.includes("manager") || 
          lowerWh === "all view"
        );

        // Agar getAllMetrics se data aa gaya hai to 0 extra call me kaam hoga
        let rawData = preloadedData;
        if (!Array.isArray(rawData)) {
          const queryWh = isGlobalUser ? "All" : currentWh;
          rawData = await safeFetch(`${GOOGLE_SHEET_URL}?action=getStockReport&warehouse=${encodeURIComponent(queryWh)}`);
        }
        if (!Array.isArray(rawData)) return;

        const allowedWarehouses = [
          "QA (Quality Assurance)",
          "Main Warehouse",
          "Packing Area",
          "Near-Expiry",
          "Damaged"
        ];

        let grouped = {};
        rawData.forEach(item => {
          let loc = String(item.location || "").trim();
          if (!allowedWarehouses.includes(loc)) return;
          if (!isGlobalUser && loc.toLowerCase() !== lowerWh) return;

          let prod = String(item.product || "").trim().toUpperCase();
          let batch = String(item.batch || "").trim().toUpperCase();
          let expRaw = String(item.exp || "").trim();
          let qty = parseFloat(String(item.qty).replace(/,/g, '')) || 0;

          if (!prod || qty <= 0) return;

          let key = `${loc}|||${prod}|||${batch}`;
          if (!grouped[key]) {
            grouped[key] = { location: loc, product: prod, batch: batch, expRaw: expRaw, qty: 0 };
          }
          grouped[key].qty += qty;
          if (!grouped[key].expRaw && expRaw) grouped[key].expRaw = expRaw;
        });

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth() + 1;

        let expiredList = [];

        Object.values(grouped).forEach(item => {
          if (item.qty <= 0) return;
          let parsedExp = parseExpiryMonthYear(item.expRaw);
          if (parsedExp) {
            let isExpired = (parsedExp.year < currentYear) || (parsedExp.year === currentYear && parsedExp.month <= currentMonth);
            if (isExpired) {
              expiredList.push({
                location: item.location,
                product: item.product,
                batch: item.batch,
                expFormatted: parsedExp.formatted,
                expSortVal: parsedExp.year * 100 + parsedExp.month,
                qty: item.qty
              });
            }
          }
        });

        expiredList.sort((a, b) => a.expSortVal - b.expSortVal || a.location.localeCompare(b.location));
        window.expiredAlertsCache = expiredList;
        window.expiredAlertsLoaded = true;

        const btn = document.getElementById("expiryNotifBtn");
        const badge = document.getElementById("expiryNotifBadge");
        if (btn && badge) {
          if (expiredList.length > 0) {
            btn.classList.add("has-alerts");
            badge.style.display = "flex";
            badge.innerText = expiredList.length > 99 ? "99+" : expiredList.length;
          } else {
            btn.classList.remove("has-alerts");
            badge.style.display = "none";
            badge.innerText = "0";
          }
        }
      } catch (e) {
        console.error("Notification check error:", e);
      }
    }

	function formatToDDMMYYYY(rawDateStr) {
      if (!rawDateStr) return "";
      let str = String(rawDateStr).trim();
      if (!str) return "";

      if (/^\d{2}-\d{2}-\d{4}$/.test(str)) {
        return str;
      }

      let parts = str.split(/[\/\s,-]+/);
      if (parts.length >= 3) {
        if (parts[0].length === 4) {
          let y = parts[0], m = parts[1].padStart(2, '0'), d = parts[2].padStart(2, '0');
          return `${d}-${m}-${y}`;
        }
        if (parts[2].length === 4) {
          let p1 = parseInt(parts[0], 10);
          let p2 = parseInt(parts[1], 10);
          let y = parts[2];
          
          if (p1 > 12) {
            return `${String(p1).padStart(2, '0')}-${String(p2).padStart(2, '0')}-${y}`;
          } else if (p2 > 12) {
            return `${String(p2).padStart(2, '0')}-${String(p1).padStart(2, '0')}-${y}`;
          } else {
            return `${String(p1).padStart(2, '0')}-${String(p2).padStart(2, '0')}-${y}`;
          }
        }
      }

      let dObj = new Date(str);
      if (!isNaN(dObj.getTime())) {
        let dd = String(dObj.getDate()).padStart(2, '0');
        let mm = String(dObj.getMonth() + 1).padStart(2, '0');
        let yyyy = dObj.getFullYear();
        return `${dd}-${mm}-${yyyy}`;
      }

      return str;
    }
