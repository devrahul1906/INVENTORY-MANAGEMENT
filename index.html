<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hatvet Pharma - Inventory Management Portal</title>

  <!-- Font Awesome for Professional Enterprise Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1e3a8a;
      --primary-light: #eff6ff;
      --background: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --warning: #d97706;
      --warning-hover: #b45309;
      --success: #16a34a;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-fast: 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--background);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    .container { 
      width: 100%; 
      max-width: 1440px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 24px; 
      padding: 24px 32px;
      flex: 1;
    }
    
    .branding-header { 
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--card-bg);
      padding: 18px 32px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      width: 100%; 
    }
    .branding-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-icon { font-size: 2.2rem; color: var(--primary); line-height: 1; flex-shrink: 0; }
    .branding-text h2 { 
      font-size: 1.4rem; 
      font-weight: 800; 
      color: #1e3a8a; 
      letter-spacing: -0.02em; 
      white-space: nowrap; 
    }
    .branding-text p { 
      font-size: 0.75rem; 
      color: var(--text-muted); 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
      margin-top: 2px; 
      white-space: nowrap; 
    }

    .datetime-stamp-badge {
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e3a8a;
      background: var(--primary-light);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid #bfdbfe;
      font-family: monospace, var(--font-family);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .card {
      width: 100%; background-color: var(--card-bg); padding: 32px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-md); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 24px;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .login-wrapper { max-width: 440px; margin: 20px auto 0 auto; width: 100%; }

    .user-info-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 20px; 
    }
    .user-details { font-size: 1rem; color: var(--text-main); font-weight: 500; }

    .metrics-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 18px; 
    }
    .metric-card { 
      background: #ffffff; 
      border: 1px solid var(--border-color); 
      padding: 20px 18px; 
      border-radius: var(--radius-md); 
      text-align: left; 
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }
    .metric-card.clickable { cursor: pointer; }
    .metric-card.clickable:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .metric-card.warning-card { background: #fffbeb; border-color: #fde68a; }
    .metric-card.danger-card { background: #fef2f2; border-color: #fecaca; }
    .metric-card.info-card { background: #f0fdf4; border-color: #bbf7d0; }
    .metric-card.main-wh-card { background: #f3e8ff; border-color: #d8b4fe; } 
    
    .metric-card span { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
    .metric-card h3 { font-size: 1.8rem; color: var(--primary); font-weight: 800; margin-top: 8px; flex-grow: 1; }
    .metric-card.warning-card h3 { color: var(--warning); }
    .metric-card.danger-card h3 { color: var(--danger); }
    .metric-card.info-card h3 { color: var(--success); }
    .metric-card.main-wh-card h3 { color: #7e22ce; }
    
    .metric-card h3 .unit-pcs { font-size: 0.9rem; font-weight: 600; margin-left: 3px; opacity: 0.85; }

    .view-stock-text {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 700;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.65;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .metric-card.clickable:hover .view-stock-text {
      opacity: 1;
      transform: translateX(4px);
    }
    .metric-card.warning-card .view-stock-text { color: var(--warning); }
    .metric-card.danger-card .view-stock-text { color: var(--danger); }
    .metric-card.info-card .view-stock-text { color: var(--success); }
    .metric-card.main-wh-card .view-stock-text { color: #7e22ce; }

    .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.88rem; font-weight: 600; color: var(--text-main); }

    input[type="text"], input[type="password"], input[type="number"], input[type="date"], select {
      width: 100%; padding: 11px 14px; font-size: 0.92rem; font-family: inherit; color: var(--text-main); background-color: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

    .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 40px !important; }
    .toggle-password { position: absolute; right: 12px; cursor: pointer; user-select: none; font-size: 1.1rem; display: none; z-index: 10; }

    button {
      width: 100%; padding: 12px 18px; font-size: 0.92rem; font-weight: 600; font-family: inherit; color: #ffffff; background-color: var(--primary); border: none; border-radius: var(--radius-sm); cursor: pointer; box-shadow: var(--shadow-sm); transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    button:hover { background-color: var(--primary-hover); box-shadow: var(--shadow-md); }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; }
    button.btn-secondary { background-color: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
    button.btn-secondary:hover { background-color: #e2e8f0; }
    button.btn-success { background-color: var(--success); }
    button.btn-success:hover { background-color: #15803d; }
    button.btn-danger { background-color: var(--danger); }
    button.btn-danger:hover { background-color: var(--danger-hover); }
    button.btn-indigo { background-color: #4f46e5; }
    button.btn-indigo:hover { background-color: #4338ca; }
    button.btn-emerald { background-color: #059669; }
    button.btn-emerald:hover { background-color: #047857; }
    button.btn-warning { background-color: var(--warning); }
    button.btn-warning:hover { background-color: var(--warning-hover); }

    .history-list { max-height: 520px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 6px; }
    .history-date-group { display: flex; flex-direction: column; gap: 8px; }
    .history-date-header { font-size: 0.82rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 5px 12px; border-radius: var(--radius-sm); display: inline-block; width: fit-content; border: 1px solid #bfdbfe; }
    
    .history-item { 
      padding: 14px 20px; background-color: #ffffff; border-radius: var(--radius-sm); border: 1px solid var(--border-color); 
      display: grid; grid-template-columns: 1.2fr 2fr 1.2fr 0.8fr; gap: 16px; align-items: center; font-size: 0.9rem; box-shadow: var(--shadow-sm);
    }
    .history-item-header { font-weight: 700; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; background: #f8fafc; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; box-shadow: none; }

    .footer { font-size: 0.85rem; color: var(--text-muted); text-align: center; font-weight: 500; margin-top: auto; padding: 20px 0; border-top: 1px solid var(--border-color); width: 100%; background: #ffffff; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
    }

    .modal-box {
      background: var(--card-bg); width: 100%; max-width: 600px; border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 20px; animation: modalPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid var(--border-color);
    }

    .pdf-item-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
    .pdf-item-table th, .pdf-item-table td { border: 1px solid var(--border-color); padding: 12px 14px; text-align: left; }
    .pdf-item-table th { background: var(--primary-light); color: var(--primary); font-weight: 700; }

    @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @media(max-width: 1200px) {
      .metrics-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media(max-width: 900px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .action-grid { grid-template-columns: repeat(2, 1fr); }
      .container { padding: 16px; }
    }
    @media(max-width: 640px) {
      .branding-header { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; }
      .branding-text h2, .branding-text p { white-space: normal; }
      .metrics-grid { grid-template-columns: 1fr; }
      .action-grid { grid-template-columns: 1fr; }
      .history-item { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>

<body>

  <div id="app" class="container"></div>
  <div id="modal-container"></div>
  
  <input type="file" id="purchasePdfInput" accept="application/pdf" style="display:none;" onchange="handlePurchasePdfUpload(this)">
  <input type="file" id="dispatchPdfInput" accept="application/pdf" style="display:none;" onchange="handleDispatchPdfUpload(this)">
  <input type="file" id="dispatchReturnPdfInput" accept="application/pdf" style="display:none;" onchange="handleDispatchReturnPdfUpload(this)">
  <input type="file" id="expiryDamagePdfInput" accept="application/pdf" style="display:none;" onchange="handleExpiryDamagePdfUpload(this)">

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzFNgSlKJEXJlyvdgrdFfgTCsp5h5WysaUrl6OoMTq-3K_E5PmGBayKwHtJuw_6w7b-/exec";

    let userScansCache = [];
    let holdInvCache = [];
    let transferInvCache = [];
    let currentStockDataCache = [];
    let fullStockDataCache = [];
    let pendingDispatchPayload = null;
    let pendingTransferPayload = null;
    let pendingDispatchReturnPayload = null;
    let pendingExpiryDamagePayload = null;

    function formatNumber(val) {
      let num = parseInt(val, 10);
      if (isNaN(num)) num = 0;
      return num.toLocaleString('en-IN');
    }

    function updateLiveDateTime() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      
      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; 
      const hoursStr = String(hours).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const formattedStamp = `${day}-${month}-${year}, ${hoursStr}:${minutes}:${seconds} ${ampm}`;
      const elem = document.getElementById("live-datetime-stamp");
      if (elem) {
        elem.innerText = formattedStamp;
      }
    }

    setInterval(updateLiveDateTime, 1000);

    setInterval(() => {
      let emp = sessionStorage.getItem("employee");
      let sessionId = sessionStorage.getItem("sessionId");
      if (emp) {
        let url = `${GOOGLE_SHEET_URL}?action=ping&user=${encodeURIComponent(emp)}`;
        if (sessionId) url += `&sessionId=${encodeURIComponent(sessionId)}`;
        fetch(url).catch(e => {});
      }
    }, 120000); 

    window.onload = function () {
      loadScansFromLocalStorage();
      let emp = sessionStorage.getItem("employee");
      let wh = sessionStorage.getItem("warehouse");
      let sessionId = sessionStorage.getItem("sessionId");
      
      if (emp && wh) {
        let url = `${GOOGLE_SHEET_URL}?action=ping&user=${encodeURIComponent(emp)}`;
        if (sessionId) url += `&sessionId=${encodeURIComponent(sessionId)}`;
        fetch(url).catch(e => {});
        
        syncDataAndShowDashboard();
      } else {
        showLoginPage();
      }
      updateLiveDateTime();
    };

    window.addEventListener('beforeunload', function (e) {
      let emp = sessionStorage.getItem("employee");
      let sessionId = sessionStorage.getItem("sessionId");
      if (emp) {
        let url = `${GOOGLE_SHEET_URL}?action=logout&user=${encodeURIComponent(emp)}&sessionId=${encodeURIComponent(sessionId || '')}`;
        fetch(url, { keepalive: true }).catch(err => {});
      }
      sessionStorage.clear(); 
    });

    function loadScansFromLocalStorage() {
      const stored = localStorage.getItem("userScansCache");
      if (stored) { try { userScansCache = JSON.parse(stored); } catch (e) { userScansCache = []; } }
    }

    function saveScansToLocalStorage() {
      localStorage.setItem("userScansCache", JSON.stringify(userScansCache));
    }

    async function fetchUserScansFromCloud() {
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=fallback`); 
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          userScansCache = data;
          saveScansToLocalStorage();
        }
        return userScansCache;
      } catch (e) {
        return userScansCache;
      }
    }

    async function fetchAllMetrics() {
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=getAllMetrics`);
        const data = await response.json();
        
        const billsElem = document.getElementById("todayBillsVal");
        if (billsElem) billsElem.innerHTML = `${formatNumber(data.todayBills || 0)} <span class="unit-pcs">NOS</span>`;

        const qaElem = document.getElementById("qaStockVal");
        if (qaElem) qaElem.innerHTML = `${formatNumber(data.qa || 0)} <span class="unit-pcs">PCS</span>`;
        
        const mainElem = document.getElementById("mainWarehouseStockVal");
        if (mainElem) mainElem.innerHTML = `${formatNumber(data.main || 0)} <span class="unit-pcs">PCS</span>`;
        
        const packingElem = document.getElementById("packingStockVal");
        if (packingElem) packingElem.innerHTML = `${formatNumber(data.packing || 0)} <span class="unit-pcs">PCS</span>`;
        
        const expiredElem = document.getElementById("expiredStockVal");
        if (expiredElem) expiredElem.innerHTML = `${formatNumber(data.expired || 0)} <span class="unit-pcs">PCS</span>`;
        
        const dispatchElem = document.getElementById("dispatchStockVal");
        if (dispatchElem) dispatchElem.innerHTML = `${formatNumber(data.dispatch || 0)} <span class="unit-pcs">PCS</span>`;
        
        const damageElem = document.getElementById("damageStockVal");
        if (damageElem) damageElem.innerHTML = `${formatNumber(data.damage || 0)} <span class="unit-pcs">PCS</span>`;

        const holdElem = document.getElementById("holdStockVal");
        if (holdElem) holdElem.innerHTML = `${formatNumber(data.hold || 0)} <span class="unit-pcs">PCS</span>`;
        
      } catch (e) {
        ["todayBillsVal", "qaStockVal", "mainWarehouseStockVal", "packingStockVal", "expiredStockVal", "dispatchStockVal", "damageStockVal", "holdStockVal"].forEach(id => {
            const el = document.getElementById(id);
            if(el && el.innerText === "Loading...") el.innerHTML = `0 <span class="unit-pcs">PCS</span>`;
        });
      }
    }

    async function showWarehouseStockDetails() {
      const targetWh = "QA (Quality Assurance)";
      openStockDetailsModal("<i class='fa-solid fa-box'></i> QA (Quality Assurance)", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=warehouseStockDetails&warehouse=${encodeURIComponent(targetWh)}`);
        const list = await response.json();
        renderStockDetailsTable("<i class='fa-solid fa-box'></i> QA (Quality Assurance)", list);
      } catch (e) {
        renderStockDetailsTable("<i class='fa-solid fa-box'></i> QA (Quality Assurance)", []);
      }
    }

      } catch (e) {

    }

      try {

    async function showDamageStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-ban'></i> Damaged Stock", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=damageStockDetails`);

      openStockDetailsModal("<i class='fa-solid fa-pause'></i> Hold Items", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=holdStockDetails`);

    async function showSampleRoomStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-vials'></i> Control Sample Room", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=sampleRoomStockDetails`);
        const list = await response.json();
        renderStockDetailsTable("<i class='fa-solid fa-vials'></i> Contorl Sample Room", list);
      } catch (e) {
        renderStockDetailsTable("<i class='fa-solid fa-vials'></i> Contorl Sample Room", []);
      }
    }

    function formatShortDate(rawStr) {
      if (!rawStr) return "";
      if (rawStr.includes("GMT") || rawStr.includes("Standard Time") || rawStr.length > 20) {
        let d = new Date(rawStr);
        if (!isNaN(d.getTime())) {
          let m = String(d.getMonth() + 1).padStart(2, '0');
          let y = String(d.getFullYear()).slice(-2);
          return m + "-" + y;
        }
      }
      return rawStr;
    }

    async function showTodayBillsDetails() {
      document.getElementById("modal-container").innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box" style="max-width: 850px; max-height: 85vh; overflow-y: auto;">
            <h3 style="color:var(--primary);"><i class="fa-solid fa-file-invoice"></i> Today's Received Bills</h3>
            <div id="stockDetailsContent" style="margin-top: 12px; text-align:center;">
              <i class="fa-solid fa-spinner fa-spin"></i> Loading today's data...
            </div>

    async function fetchUserWarehouses() {
      let emp = document.getElementById("employee").value.trim();
      let whSelect = document.getElementById("warehouse");
      
      if (!emp) {
        whSelect.innerHTML = '<option value="">-- Enter Username to Load Warehouses --</option>';
        return;
      }
      
      whSelect.innerHTML = '<option value="">-- Loading Warehouses... --</option>';
      
      try {
        let response = await fetch(`${GOOGLE_SHEET_URL}?action=getUserWarehouses&employee=${encodeURIComponent(emp)}`);
        let warehouses = await response.json();
        
        if (warehouses.length === 0) {
          whSelect.innerHTML = '<option value="">-- Invalid User / No Access --</option>';
        } else {
          let opts = '<option value="">-- Select Warehouse --</option>';
          warehouses.forEach(wh => {
            let displayText = wh === "All View" ? "All View (For Management Use Only)" : wh;
            opts += `<option value="${escapeHtml(wh)}">${escapeHtml(displayText)}</option>`;
          });
          whSelect.innerHTML = opts;
          
          if (warehouses.length === 1) {
             whSelect.value = warehouses[0];
          }
        }
      } catch (e) {
        whSelect.innerHTML = '<option value="">-- Error loading warehouses --</option>';
      }
    }

    async function login() {
      let emp = document.getElementById("employee").value.trim();
      let pass = document.getElementById("password").value.trim();
      let wh = document.getElementById("warehouse").value;
      let loginBtn = document.getElementById("loginBtn");

      if (!emp || !pass || !wh) { alert("Please fill in Employee Name, Password, and select Warehouse!"); return; }

      if (loginBtn) { loginBtn.disabled = true; loginBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Authenticating..."; }

      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=login&employee=${encodeURIComponent(emp)}&password=${encodeURIComponent(pass)}&warehouse=${encodeURIComponent(wh)}`);
        const data = await response.json();

        if (data.status === "success") {
          sessionStorage.setItem("employee", data.employeeName || emp);
          sessionStorage.setItem("warehouse", wh);
          sessionStorage.setItem("role", data.role || "Standard");
          if (data.sessionId) {
            sessionStorage.setItem("sessionId", data.sessionId);
          }
          syncDataAndShowDashboard();
        } else {
          alert("❌ Access Denied: " + (data.message || "Invalid Employee Name or Password!"));
          if (loginBtn) { loginBtn.disabled = false; loginBtn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>'; }
        }
      } catch (e) {
        let msg = e.message;
        alert("⚠️ Connection error: " + msg);
        if (loginBtn) { loginBtn.disabled = false; loginBtn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>'; }
      }
    }

    async function downloadUserLogs() {
      try {
        let btn = document.querySelector("#modal-container .btn-emerald");
        if(btn) btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Exporting...";
        
        let res = await fetch(`${GOOGLE_SHEET_URL}?action=getUserLogs`);
        let data = await res.json();
        
        if (!data || data.length === 0) {
          alert("No login history found.");
          if(btn) btn.innerHTML = "<i class='fa-solid fa-file-excel'></i> Export Login History";
          return;
        }
        
        let exportData = data.map((item, idx) => ({
          "S.No": idx + 1,
          "User Name": item.user,
          "Role": item.role,
          "Warehouse": item.warehouse,
          "Login Time": item.loginTime,
          "Last Active / Logout": item.logoutTime,
          "Duration": item.duration
        }));
        
        let ws = XLSX.utils.json_to_sheet(exportData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Login History");
        XLSX.writeFile(wb, "System_Login_History_" + new Date().toISOString().slice(0,10) + ".xlsx");
        
        if(btn) btn.innerHTML = "<i class='fa-solid fa-file-excel'></i> Export Login History";
      } catch(e) {
        alert("Export Error: " + e.message);
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function savePurchaseModalData() {
      let globalSupplier = document.getElementById("global_supplier").value.trim();
      if (!globalSupplier) { alert("Please select a Supplier Name!"); return; }

      let rows = document.querySelectorAll(".purchase-item-row");
      let itemsArray = [];
      let submitBtn = document.querySelector("#modal-container button.btn-success");
      if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Preparing Files..."; }

      for (let i = 0; i < rows.length; i++) {
        let row = rows[i];
        let pCategory = row.querySelector(".p_category").value;
        let pName = row.querySelector(".p_name").value.trim();
        let pBatch = row.querySelector(".p_batch").value.trim();
        let pMfg = row.querySelector(".p_mfg").value;
        let pExp = row.querySelector(".p_exp").value;
        let pMrp = row.querySelector(".p_mrp").value;
        let rawQty = parseInt(row.querySelector(".p_qty").value, 10) || 1;
        let fileInput = row.querySelector(".p_coa");

        if (!pCategory || !pName || !pBatch) { 
          alert(`Please fill Category, Product Name, and Batch in Product #${i + 1}!`); 
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit All Entries"; }
          return; 
        }

        let fileData = null;
        if (fileInput && fileInput.files.length > 0) {
           let file = fileInput.files[0];
           if (file.size > 5 * 1024 * 1024) { 
              alert(`COA File for ${pName} is too large. Max 5MB allowed.`);
              if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit All Entries"; }
              return;
           }
           let base64Full = await readFileAsBase64(file);
           fileData = {
              filename: file.name,
              mimeType: file.type,
              base64: base64Full.split(",")[1]
           };
        }

        let finalQty = (pCategory.toLowerCase() === "tablets") ? rawQty * 10 : rawQty;

        itemsArray.push({
          category: pCategory, 
          product: pName.toUpperCase(), 
          batch: pBatch.toUpperCase(),
          mfg: pMfg, exp: pExp, mrp: pMrp, qty: finalQty, coa: fileData
        });
      }

      if (submitBtn) { submitBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Saving Data to Cloud..."; }

      let payload = {
        action: "Purchase Entry", user: sessionStorage.getItem("employee") || "",
        warehouse: sessionStorage.getItem("warehouse") || "", type: "Purchase Entry",
        supplier: globalSupplier, items: itemsArray, scanTime: new Date().toLocaleString()
      };

      try {
        const response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const resData = JSON.parse(await response.text());

        if (resData.status === "success") {
          alert(`✅ All ${itemsArray.length} items saved successfully!`);
          closeModalAndResume(); syncDataAndShowDashboard();
        } else {
          alert("❌ Error: " + resData.message);
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit All Entries"; }
        }
      } catch (e) {
        alert("⚠️ Error: " + e.message);
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit All Entries"; }
      }
    }

    async function handleExpiryDamagePdfUpload(input) {
      if (!input.files || input.files.length === 0) return;
      let file = input.files[0];
      
      try {
        let arrayBuffer = await file.arrayBuffer();
        let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let textItems = [];

        for (let i = 1; i <= pdf.numPages; i++) {
          let page = await pdf.getPage(i);
          let textContent = await page.getTextContent();
          
          textContent.items.forEach(item => {
            textItems.push({
              str: item.str.trim(),
              x: item.transform[4],
              y: item.transform[5],
              page: i
            });
          });
        }

        let fullText = textItems.map(item => item.str).join(" ");
        let invoiceMatch = fullText.match(/Invoice\s*No\.?\s*([A-Z0-9\-]+)/i) || fullText.match(/CA[0-9]+/i);
        let invoiceNo = invoiceMatch ? (invoiceMatch[1] || invoiceMatch[0]) : "EXP-" + Math.floor(Math.random() * 10000);

        let itemsFound = [];

        let pagesMap = {};
        textItems.forEach(item => {
          if (!pagesMap[item.page]) pagesMap[item.page] = [];
          pagesMap[item.page].push(item);
        });

        Object.keys(pagesMap).forEach(pageNum => {
          let pageItems = pagesMap[pageNum];
          let rowsMap = {};
          
          pageItems.forEach(item => {
            let yKey = Math.round(item.y / 4) * 4;
            if (!rowsMap[yKey]) rowsMap[yKey] = [];
            rowsMap[yKey].push(item);
          });

          let sortedYKeys = Object.keys(rowsMap).sort((a, b) => b - a); 

          sortedYKeys.forEach(yKey => {
            let rowElements = rowsMap[yKey].sort((a, b) => a.x - b.x); 
            let texts = rowElements.map(el => el.str).filter(str => str !== "");
            let rowString = texts.join(" ");

            if (/(E-Mail|Invoice|Due Date|L\.R\.|E-WAY|IRN|Party Name|DELIVERY AT|TOTAL|GST|Terms|A\/c|IFSC|Rs\.|Discount|@gmail\.com|Phone:|D\.L\.No|GSTIN|Bank Details|Grand Total|CLASS|TAXABLE AMT)/i.test(rowString)) {
              return;
            }

            let itemRegex = /(?:(?:^|\s)(\d+)\s*\.\s+)?(\d+)\s+(.+?)\s+([A-Z0-9\-\/_]+)\s+(\d{1,2}\/\d{2,4})\s+(\d{6,10})\s+\d+(\.\d+)?/i;
            let match = rowString.match(itemRegex);

            if (match) {
              let qty = parseInt(match[2], 10);
              let rawProd = match[3].trim();
              let batch = match[4].trim();
              
              rawProd = rawProd.replace(/^[A-Z]{3,5}\s+/, ''); 
              rawProd = rawProd.replace(/^(1\*\d+|[0-9.]+\s*(ML|GM|MG|ml|gm|mg))\s+/i, '').trim();

              if (qty > 0 && rawProd.length > 2 && batch.length > 2) {
                let exists = itemsFound.some(i => i.product === rawProd.toUpperCase() && i.batch === batch.toUpperCase());
                if (!exists) {
                  itemsFound.push({
                    product: rawProd.toUpperCase(),
                    batch: batch.toUpperCase(),
                    qty: qty
                  });
                }
              }
            }
          });
        });

        if (itemsFound.length === 0) {
          alert("⚠️ Failed to extract products. Ensure the PDF format matches the expected Challan structure.");
          input.value = "";
          return;
        }

        pendingExpiryDamagePayload = {
          action: "expiry_damage_dispatch",
          user: sessionStorage.getItem("employee") || "",
          invoiceNo: invoiceNo,
          items: itemsFound
        };

        openExpiryDamageConfirmationModal();
      } catch (err) {
        console.error(err);
        alert("⚠️ PDF Parsing Error: " + err.message);
      }
      input.value = "";
    }

    async function handleDispatchPdfUpload(input) {
      if (!input.files || input.files.length === 0) return;
      let file = input.files[0];
      
      try {
        let arrayBuffer = await file.arrayBuffer();
        let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let textItems = [];

        for (let i = 1; i <= pdf.numPages; i++) {
          let page = await pdf.getPage(i);
          let textContent = await page.getTextContent();
          
          textContent.items.forEach(item => {
            textItems.push({
              str: item.str.trim(),
              x: item.transform[4],
              y: item.transform[5]
            });
          });
        }

        let fullText = textItems.map(item => item.str).join(" ");
        let invoiceMatch = fullText.match(/Invoice\s*No\.?\s*([A-Z0-9\-]+)/i) || fullText.match(/A00[0-9]+/);
        let invoiceNo = invoiceMatch ? (invoiceMatch[1] || invoiceMatch[0]) : "INV-" + Math.floor(Math.random() * 10000);

        let qtyX = null;
        let freeX = null;
        textItems.forEach(item => {
          let t = item.str.toUpperCase();
          if (t === "QTY" || t === "QTY.") qtyX = item.x;
          if (t === "FREE" || t === "FREE." || t === "FREE..") freeX = item.x;
        });

        let rowsMap = {};
        textItems.forEach(item => {
          let yKey = Math.round(item.y / 6) * 6;
          if (!rowsMap[yKey]) rowsMap[yKey] = [];
          rowsMap[yKey].push(item);
        });

        let itemsFound = [];
        let sortedYKeys = Object.keys(rowsMap).sort((a, b) => b - a);

        sortedYKeys.forEach(yKey => {
          let rowElements = rowsMap[yKey].sort((a, b) => a.x - b.x);
          let texts = rowElements.map(el => el.str);
          let rowString = texts.join(" ");

          rowString = rowString.replace(/\$\s*/g, '$').replace(/\s*\/\s*/g, '/');

          if (/(E-Mail|Invoice|Due Date|L\.R\.|E-WAY|IRN|Party Name|DELIVERY AT|TOTAL|GST|Terms|A\/c|IFSC|Rs\.|Discount|@gmail\.com|Phone:|D\.L\.No|GSTIN|Bank Details|Grand Total|CLASS|TAXABLE AMT)/i.test(rowString)) {
            return;
          }

          let expMatch = rowString.match(/(?:\s|^)(\$?\d{1,2}[\/\-]\d{2,4}\$?)(?:\s|$)/);
          
          if (expMatch) {

                    let numStr = nums[0].toString();

                      let distToQty = Math.abs(numEl.x - qtyX);

                   billedQty = nums[0];
                } else {
                   billedQty = 1; 
                }
              }

                if (preTokens.length > 0 && /^\d+(\.\d+)?$/.test(preTokens[preTokens.length - 1])) {
                  preTokens.pop(); 
                }
              }
              
              let prodName = preTokens.join(" ").trim().toUpperCase();
              batchToken = batchToken.toUpperCase();
              
              if (totalQty === 0 && prodName.length > 3) { billedQty = 1; totalQty = 1; }

                 let exists = itemsFound.some(item => item.product === prodName && item.batch === batchToken);

               let batchIdx = rowElements.findIndex(el => el.str === possibleBatch);

        let newBatch = document.getElementById("edit_d_batch_" + i).value.trim();

          return;
        }

        items[i].billedQty = newBilled;
        items[i].freeQty = newFree;
        items[i].qty = newBilled + newFree;
      }

      let confirmBtn = document.querySelector("#modal-container button.btn-success");
      if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Processing..."; }

      try {
        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(pendingDispatchPayload)
        });
        
        let text = await response.text();
        
        if (text.includes("<!DOCTYPE") || text.includes("<html")) {
            throw new Error("Google blocked the request! Please deploy your Apps Script again with 'Who has access' set to 'Anyone'.");
        }

        let resData = JSON.parse(text);

        if (resData.status === "success") {
          alert("✅ Bill Proceed Successfully");
          pendingDispatchPayload = null;
          closeModalAndResume();
          syncDataAndShowDashboard();
        } else {
          alert("❌ REJECTED:\n\n" + resData.message);
          closeModalAndResume();
        }
      } catch (err) {
        alert("⚠️ " + err.message);
        if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.innerText = "Yes, Proceed"; }
      }
    }

    function parsePdfExpiryToDate(expStr) {
      if (!expStr || !expStr.includes("/")) return "2030-01-01";
      let parts = expStr.replace(/\$/g, '').split("/");
      let month = parts[0].padStart(2, '0');
      let year = parts[1];
      if (year.length === 2) { year = "20" + year; }
      return `${year}-${month}-01`;
    }

          let expDateObj = new Date(formattedExpDate);
          let timeDiff = expDateObj.getTime() - currentDate.getTime();
          let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
          if (daysDiff <= 90) {
             statusText = "Expired";
             statusClass = "color:var(--danger); font-weight:700;";
          }
        }
        
        items[i].batch = newBatch.toUpperCase();
        items[i].exp = newExp;
        items[i].billedQty = newBilled;
        items[i].freeQty = newFree;
        items[i].qty = newBilled + newFree;
        items[i].mrp = newMrp;
        items[i].expDate = formattedExpDate;
        items[i].status = statusText;
        items[i].statusClass = statusClass;
      }

      let confirmBtn = document.querySelector("#modal-container button.btn-success");
      if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Processing Return..."; }

      try {
        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(pendingDispatchReturnPayload)
        });
        
        let text = await response.text();
        
        if (text.includes("<!DOCTYPE") || text.includes("<html")) {
            throw new Error("Google blocked the request! Please deploy your Apps Script again with 'Who has access' set to 'Anyone'.");
        }

        let resData = JSON.parse(text);

        if (resData.status === "success") {
          alert("✅ " + resData.message);
          pendingDispatchReturnPayload = null;
          closeModalAndResume();
          syncDataAndShowDashboard();
        } else {
          alert("❌ ERROR:\n\n" + resData.message);
          closeModalAndResume();
        }
      } catch (err) {
        alert("⚠️ Connection Error: " + err.message);
        if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.innerText = "Confirm & Sync"; }
      }
    }

    function updateSuspenseStatus() {
      let expVal = document.getElementById("sr_exp").value.trim();
      let statusBox = document.getElementById("sr_status_box");
      let daysText = document.getElementById("sr_days_text");
      
      let formattedExpDate = parsePdfExpiryToDate(expVal); 
      
      if (!expVal || expVal.length < 5) {
         statusBox.innerText = "Pending";
         statusBox.style.color = "var(--text-muted)";
         daysText.innerText = "";
         return;
      }

      if (formattedExpDate) {
        let expDateObj = new Date(formattedExpDate);
        let currentDate = new Date();
        let timeDiff = expDateObj.getTime() - currentDate.getTime();
        let daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
        
        daysText.innerText = daysDiff + " Days remaining";

        if (daysDiff <= 90) {
           statusBox.innerText = "Near-Expiry";
           statusBox.style.color = "var(--danger)";
        } else {
           statusBox.innerText = "Usable";
           statusBox.style.color = "var(--success)";
        }
      }
    }

    async function submitSalesReturnSuspense() {
      let product = document.getElementById("sr_product").value.trim();
      let batch = document.getElementById("sr_batch").value.trim();
      let exp = document.getElementById("sr_exp").value.trim();
      let qty = parseInt(document.getElementById("sr_qty").value, 10) || 0;
      let free = parseInt(document.getElementById("sr_free").value, 10) || 0;
      let mrp = document.getElementById("sr_mrp").value.trim() || "0.00";

      if (!product || !batch || !exp || (qty + free) <= 0) {
        alert("Please fill Product Name, Batch, Exp Date, and ensure Qty + Free is greater than 0!");
        return;
      }

      let formattedExpDate = parsePdfExpiryToDate(exp);

      let submitBtn = document.querySelector("#modal-container button.btn-success");
      if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Submitting..."; }

      let payload = {
        action: "sales_return_suspense",
        user: sessionStorage.getItem("employee") || "",
        warehouse: sessionStorage.getItem("warehouse") || "",
        product: product.toUpperCase(),
        batch: batch.toUpperCase(),
        expDate: formattedExpDate,
        qty: qty,
        free: free,
        mrp: mrp
      };

      try {
        const response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const resData = JSON.parse(await response.text());

        if (resData.status === "success") {
          alert("✅ " + resData.message);
          closeModalAndResume();
          syncDataAndShowDashboard();
        } else {
          alert("❌ Error: " + resData.message);
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit Entry"; }
        }
      } catch (e) {
        alert("⚠️ Error: " + e.message);
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit Entry"; }
      }
    }

    async function loadCurrentWarehouseReport() {
      let wh = sessionStorage.getItem("warehouse") || "";
      let lowerWh = wh.trim().toLowerCase();
      let actionUrl = "";

      if (lowerWh === "main warehouse") actionUrl = "mainWarehouseStockDetails";
      else if (lowerWh === "packing area") actionUrl = "packingStockDetails";
      else if (lowerWh === "near-expiry") actionUrl = "expiredStockDetails";
      else if (lowerWh === "damaged") actionUrl = "damageStockDetails";
      else if (lowerWh === "other location") actionUrl = "warehouseStockDetails&warehouse=Other Location";
      else actionUrl = "warehouseStockDetails&warehouse=" + encodeURIComponent(wh);

      document.getElementById("modal-container").innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <h3 style="color:var(--primary); text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Loading Report...</h3>
          </div>
        </div>
      `;

      try {
        let res = await fetch(`${GOOGLE_SHEET_URL}?action=${actionUrl}`);
        if (!res.ok) throw new Error("Network Error");
        let text = await res.text();
        try {
           let parsedData = JSON.parse(text);
           currentStockDataCache = parsedData.filter(item => parseInt(item.totalQty, 10) > 0);
        } catch(e) {
           console.error("Not JSON:", text);
           throw new Error("Invalid response from server");
        }
        renderCurrentStockReport(wh, currentStockDataCache);
      } catch (e) {
        alert("Error loading report. " + e.message);
        closeModalAndResume();
      }
    }

    function downloadCurrentStockExcel() {

      }));

      let wb = XLSX.utils.book_new();

    async function loadFullStockReport() {
      document.getElementById("modal-container").innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <h3 style="color:var(--primary); text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Loading Full Report...</h3>
          </div>
        </div>
      `;
      try {
        let res = await fetch(`${GOOGLE_SHEET_URL}?action=fullStockReport`);
        if (!res.ok) throw new Error("Network Error");
        let text = await res.text();
        try {
           let rawData = JSON.parse(text);
           renderFullStockReport(rawData);
        } catch(e) {
           console.error("Not JSON:", text);
           throw new Error("Invalid response from server");
        }
      } catch (e) {
        alert("Error loading full report. It might be taking too long. " + e.message);
        openStockReportModal();
      }
    }

function renderFullStockReport(data) {
  let groupedData = {};
  
  if (data && data.length > 0) {
    data.forEach(item => {
      let shortExp = item.exp ? formatShortDate(item.exp.toString()) : "";
      let loc = item.location ? item.location.toString().trim() : "";
      let prod = item.product ? item.product.toString().trim() : "";
      let batch = item.batch ? item.batch.toString().trim() : "";
      let mrp = item.mrp ? item.mrp.toString().trim() : "";
      
      let key = loc + "|" + prod + "|" + batch + "|" + shortExp + "|" + mrp;
      
      if (!groupedData[key]) {
        groupedData[key] = {
          location: loc,
          product: prod,
          batch: batch,
          exp: shortExp, 
          mrp: mrp,
          qty: 0
        };
      }
      
      let itemQty = parseFloat(String(item.qty).replace(/,/g, '')) || 0;
      groupedData[key].qty += itemQty;
    });
  }
  
  let aggregatedArray = Object.values(groupedData).filter(item => item.qty > 0);
  
  aggregatedArray.sort((a, b) => a.product.localeCompare(b.product));
  
  fullStockDataCache = aggregatedArray;

  let tbody = "";
  if (aggregatedArray.length === 0) {
    tbody = `<tr><td colspan="7" style="text-align:center;">No stock available</td></tr>`;
  } else {
    tbody = aggregatedArray.map((item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td>${escapeHtml(item.location)}</td>
        <td><b>${escapeHtml(item.product)}</b></td>
        <td>${escapeHtml(item.batch)}</td>
        <td>${escapeHtml(item.exp)}</td>
        <td style="text-align:right; font-weight:bold; color:var(--primary);">${formatNumber(item.qty)}</td>
        <td>${escapeHtml(item.mrp)}</td>
      </tr>
    `).join("");
  }

  document.getElementById("modal-container").innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box" style="max-width: 950px; max-height: 90vh; overflow-y: auto;">
        <h3 style="color:var(--primary);"><i class="fa-solid fa-chart-column"></i> Full Stock Report</h3>
        <div style="display:flex; justify-content:space-between; margin-top:8px;">
          <button onclick="downloadFullStockExcel()" class="btn-emerald" style="width:auto; padding:8px 16px;"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
          <button onclick="openStockReportModal()" class="btn-secondary" style="width:auto; padding:8px 16px;"><i class="fa-solid fa-arrow-left"></i> Back</button>
        </div>
        <table class="pdf-item-table" style="margin-top:16px; font-size: 0.8rem;">
          <thead>
            <tr>
              <th style="width: 5%;">Sr.No</th>
              <th>Location</th>
              <th>Product Name</th>
              <th>Batch No.</th>
              <th>Expiry Date</th>
              <th style="text-align:right;">Available Qty</th>
              <th>MRP</th>
            </tr>
          </thead>
          <tbody>
            ${tbody}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

    function downloadFullStockExcel() {
      try {
        if (!fullStockDataCache || fullStockDataCache.length === 0) {
          alert("No data available to export.");
          return;
        }
        let exportData = [];
        for (let i = 0; i < fullStockDataCache.length; i++) {
          let item = fullStockDataCache[i];
          exportData.push({
            "Sr.No": i + 1,
            "Location": item.location ? item.location.toString() : "N/A",
            "Product Name": item.product ? item.product.toString() : "N/A",
            "Batch No.": item.batch ? item.batch.toString() : "N/A",
            "Expiry Date": item.exp ? formatShortDate(item.exp.toString()) : "N/A",
            "Available Qty": parseInt(item.qty) || 0,
            "MRP": item.mrp ? item.mrp.toString() : "N/A"
          });
        }
        let ws = XLSX.utils.json_to_sheet(exportData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Full Stock Report");
        let dateStr = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, "Full_Stock_Report_" + dateStr + ".xlsx");
      } catch (err) {
        console.error("Export Error: ", err);
        alert("Export failed: " + err.message);
      }
    }

    async function openPendingCOAModal() {
      document.getElementById("modal-container").innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box" style="max-width: 900px; max-height: 90vh; overflow-y: auto;">
            <h3 style="color: #be123c;"><i class="fa-solid fa-spinner fa-spin"></i> Fetching Pending COAs...</h3>
          </div>
        </div>
      `;

      try {
        let res = await fetch(`${GOOGLE_SHEET_URL}?action=getPendingCOA`);
        let data = await res.json();
        
        if (data.length === 0) {
          document.getElementById("modal-container").innerHTML = `
            <div class="modal-overlay">
              <div class="modal-box" style="max-width: 600px; text-align: center;">
                <h3 style="color:var(--success);"><i class="fa-solid fa-check-circle"></i> No Pending COAs!</h3>
                <p>All products have their COAs uploaded successfully.</p>
                <button onclick="closeModalAndResume()" class="btn-secondary" style="margin-top: 15px;">Close</button>
              </div>
            </div>`;
          return;
        }

        let rows = data.map(item => {
          let formattedDate = item.date;
          let d = new Date(item.date);
          if (!isNaN(d.getTime())) {
            let dd = String(d.getDate()).padStart(2, '0');
            let mm = String(d.getMonth() + 1).padStart(2, '0');
            let yy = String(d.getFullYear()).slice(-2);
            formattedDate = dd + "-" + mm + "-" + yy;
          }

          return `
          <tr id="pending_row_${item.rowIdx}">
            <td><b>${escapeHtml(item.product)}</b></td>
            <td>${escapeHtml(item.batch)}</td>
            <td>${escapeHtml(item.supplier)}</td>
            <td>${escapeHtml(formattedDate)}</td>
            <td style="text-align:center;">
               <input type="file" id="inline_coa_${item.rowIdx}" accept=".pdf, .jpg, .jpeg" style="display:none;" onchange="executeInlineCOAUpload(${item.rowIdx})">
               <button onclick="document.getElementById('inline_coa_${item.rowIdx}').click()" class="btn-indigo" style="padding: 6px 12px; font-size: 0.8rem; width: auto;"><i class="fa-solid fa-upload"></i> Upload COA</button>
            </td>
          </tr>
        `}).join("");

        document.getElementById("modal-container").innerHTML = `
          <div class="modal-overlay">
            <div class="modal-box" style="max-width: 950px; max-height: 90vh; overflow-y: auto;">
              <h3 style="color: #be123c;"><i class="fa-solid fa-file-circle-xmark"></i> Missing COA Approvals</h3>
              <p style="font-size:0.85rem; color:var(--text-muted);">Upload COA PDFs or Images for the following pending entries.</p>
              
              <table class="pdf-item-table" style="font-size: 0.85rem;">
                <thead>
                  <tr>
                    <th>Product Name</th>
                    <th>Batch</th>
                    <th>Supplier</th>
                    <th>Entry Date</th>
                    <th style="text-align:center;">Action</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
              <button onclick="closeModalAndResume()" class="btn-secondary" style="margin-top: 15px;">Close Panel</button>
            </div>
          </div>
        `;
      } catch(e) {
        alert("Error loading pending COAs: " + e.message);
        closeModalAndResume();
      }
    }

    async function executeInlineCOAUpload(rowIdx) {
      let fileInput = document.getElementById(`inline_coa_${rowIdx}`);
      if (!fileInput || fileInput.files.length === 0) return;
      
      let file = fileInput.files[0];
      if (file.size > 5 * 1024 * 1024) { alert(`File too large. Max 5MB allowed.`); return; }
      
      let btn = fileInput.nextElementSibling;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading...`;

      try {
        let base64Full = await readFileAsBase64(file);
        let payload = {
          action: "uploadPendingCOA",
          rowIdx: rowIdx,
          coa: { filename: file.name, mimeType: file.type, base64: base64Full.split(",")[1] }
        };

        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        
        let resData = JSON.parse(await response.text());
        if (resData.status === "success") {
           alert("✅ COA Uploaded and saved to Server!");
           let rowElement = document.getElementById(`pending_row_${rowIdx}`);
           if (rowElement) rowElement.remove();
        } else {
           alert("❌ Upload Error: " + resData.message);
           btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-upload"></i> Retry Upload`;
        }
      } catch(e) {
        alert("Upload Failed: " + e.message);
        btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-upload"></i> Retry Upload`;
      }
    }

    async function logout() { 
      let user = sessionStorage.getItem("employee");
      let sessionId = sessionStorage.getItem("sessionId");
      if (user) {
        try { await fetch(`${GOOGLE_SHEET_URL}?action=logout&user=${encodeURIComponent(user)}&sessionId=${encodeURIComponent(sessionId || '')}`); } catch(e){}
      }
      sessionStorage.clear(); userScansCache = []; showLoginPage(); 
    }
    
    function escapeHtml(str) { return !str ? '' : String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&quot;").replace(/'/g, "&#039;"); }
  </script>
