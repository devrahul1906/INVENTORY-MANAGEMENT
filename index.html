<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hatvet Pharma - Inventory Management Portal</title>

  <!-- Font Awesome for Professional Enterprise Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1e3a8a;
      --primary-light: #eff6ff;
      --background: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --warning: #d97706;
      --warning-hover: #b45309;
      --success: #16a34a;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-fast: 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--background);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    .container { 
      width: 100%; 
      max-width: 1440px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 24px; 
      padding: 24px 32px;
      flex: 1;
    }
    
    .branding-header { 
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--card-bg);
      padding: 18px 32px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      width: 100%; 
    }
    .branding-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-icon { font-size: 2.2rem; color: var(--primary); line-height: 1; flex-shrink: 0; }
    .branding-text h2 { 
      font-size: 1.4rem; 
      font-weight: 800; 
      color: #1e3a8a; 
      letter-spacing: -0.02em; 
      white-space: nowrap; 
    }
    .branding-text p { 
      font-size: 0.75rem; 
      color: var(--text-muted); 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
      margin-top: 2px; 
      white-space: nowrap; 
    }

    .datetime-stamp-badge {
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e3a8a;
      background: var(--primary-light);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid #bfdbfe;
      font-family: monospace, var(--font-family);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .card {
      width: 100%; background-color: var(--card-bg); padding: 32px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-md); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 24px;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }
    .login-wrapper { max-width: 440px; margin: 20px auto 0 auto; width: 100%; }

    .user-info-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border-color); 
      padding-bottom: 20px; 
    }
    .user-details { font-size: 1rem; color: var(--text-main); font-weight: 500; }

    .metrics-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 18px; 
    }
    .metric-card { 
      background: #ffffff; 
      border: 1px solid var(--border-color); 
      padding: 20px 18px; 
      border-radius: var(--radius-md); 
      text-align: left; 
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }
    .metric-card.clickable { cursor: pointer; }
    .metric-card.clickable:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .metric-card.warning-card { background: #fffbeb; border-color: #fde68a; }
    .metric-card.danger-card { background: #fef2f2; border-color: #fecaca; }
    .metric-card.info-card { background: #f0fdf4; border-color: #bbf7d0; }
    .metric-card.main-wh-card { background: #f3e8ff; border-color: #d8b4fe; } 
    
    .metric-card span { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
    .metric-card h3 { font-size: 1.8rem; color: var(--primary); font-weight: 800; margin-top: 8px; flex-grow: 1; }
    .metric-card.warning-card h3 { color: var(--warning); }
    .metric-card.danger-card h3 { color: var(--danger); }
    .metric-card.info-card h3 { color: var(--success); }
    .metric-card.main-wh-card h3 { color: #7e22ce; }
    
    .metric-card h3 .unit-pcs { font-size: 0.9rem; font-weight: 600; margin-left: 3px; opacity: 0.85; }

    .view-stock-text {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 700;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.65;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .metric-card.clickable:hover .view-stock-text {
      opacity: 1;
      transform: translateX(4px);
    }
    .metric-card.warning-card .view-stock-text { color: var(--warning); }
    .metric-card.danger-card .view-stock-text { color: var(--danger); }
    .metric-card.info-card .view-stock-text { color: var(--success); }
    .metric-card.main-wh-card .view-stock-text { color: #7e22ce; }

    .action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.88rem; font-weight: 600; color: var(--text-main); }

    input[type="text"], input[type="password"], input[type="number"], input[type="date"], select {
      width: 100%; padding: 11px 14px; font-size: 0.92rem; font-family: inherit; color: var(--text-main); background-color: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

    .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 40px !important; }
    .toggle-password { position: absolute; right: 12px; cursor: pointer; user-select: none; font-size: 1.1rem; display: none; z-index: 10; }

    button {
      width: 100%; padding: 12px 18px; font-size: 0.92rem; font-weight: 600; font-family: inherit; color: #ffffff; background-color: var(--primary); border: none; border-radius: var(--radius-sm); cursor: pointer; box-shadow: var(--shadow-sm); transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    button:hover { background-color: var(--primary-hover); box-shadow: var(--shadow-md); }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; }
    button.btn-secondary { background-color: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
    button.btn-secondary:hover { background-color: #e2e8f0; }
    button.btn-success { background-color: var(--success); }
    button.btn-success:hover { background-color: #15803d; }
    button.btn-danger { background-color: var(--danger); }
    button.btn-danger:hover { background-color: var(--danger-hover); }
    button.btn-indigo { background-color: #4f46e5; }
    button.btn-indigo:hover { background-color: #4338ca; }
    button.btn-emerald { background-color: #059669; }
    button.btn-emerald:hover { background-color: #047857; }
    button.btn-warning { background-color: var(--warning); }
    button.btn-warning:hover { background-color: var(--warning-hover); }

    .history-list { max-height: 520px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 6px; }
    .history-date-group { display: flex; flex-direction: column; gap: 8px; }
    .history-date-header { font-size: 0.82rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 5px 12px; border-radius: var(--radius-sm); display: inline-block; width: fit-content; border: 1px solid #bfdbfe; }
    
    .history-item { 
      padding: 14px 20px; background-color: #ffffff; border-radius: var(--radius-sm); border: 1px solid var(--border-color); 
      display: grid; grid-template-columns: 1.2fr 2fr 1.2fr 0.8fr; gap: 16px; align-items: center; font-size: 0.9rem; box-shadow: var(--shadow-sm);
    }
    .history-item-header { font-weight: 700; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; background: #f8fafc; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; box-shadow: none; }

    .footer { font-size: 0.85rem; color: var(--text-muted); text-align: center; font-weight: 500; margin-top: auto; padding: 20px 0; border-top: 1px solid var(--border-color); width: 100%; background: #ffffff; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
    }

    .modal-box {
      background: var(--card-bg); width: 100%; max-width: 600px; border-radius: var(--radius-md); padding: 32px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 20px; animation: modalPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid var(--border-color); position: relative;
    }

    /* TOP CLOSE BUTTON STYLES */
    .modal-close-btn {
      position: absolute; top: 16px; right: 16px; background: #f1f5f9; color: var(--danger); border: 1px solid var(--border-color); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: var(--shadow-sm); z-index: 50; transition: all 0.2s ease;
    }
    .modal-close-btn:hover { background: #fee2e2; color: #b91c1c; transform: scale(1.1); }

    .pdf-item-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.9rem; }
    .pdf-item-table th, .pdf-item-table td { border: 1px solid var(--border-color); padding: 12px 14px; text-align: left; }
    .pdf-item-table th { background: var(--primary-light); color: var(--primary); font-weight: 700; }

    @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    @media(max-width: 1200px) {
      .metrics-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media(max-width: 900px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .action-grid { grid-template-columns: repeat(2, 1fr); }
      .container { padding: 16px; }
    }
    @media(max-width: 640px) {
      .branding-header { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; }
      .branding-text h2, .branding-text p { white-space: normal; }
      .metrics-grid { grid-template-columns: 1fr; }
      .action-grid { grid-template-columns: 1fr; }
      .history-item { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>

<body>

  <div id="app" class="container"></div>
  <div id="modal-container"></div>
  
  <input type="file" id="purchasePdfInput" accept="application/pdf" style="display:none;" onchange="handlePurchasePdfUpload(this)">
  <input type="file" id="dispatchPdfInput" accept="application/pdf" style="display:none;" onchange="handleDispatchPdfUpload(this)">
  <input type="file" id="dispatchReturnPdfInput" accept="application/pdf" style="display:none;" onchange="handleDispatchReturnPdfUpload(this)">
  <input type="file" id="expiryDamagePdfInput" accept="application/pdf" style="display:none;" onchange="handleExpiryDamagePdfUpload(this)">

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // REMEMBER: UPDATE THIS URL TO YOUR DEPLOYED WEB APP URL
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzFNgSlKJEXJlyvdgrdFfgTCsp5h5WysaUrl6OoMTq-3K_E5PmGBayKwHtJuw_6w7b-/exec";

    let userScansCache = [];
    let holdInvCache = [];
    let transferInvCache = [];
    let currentStockDataCache = [];
    let fullStockDataCache = [];
    let pendingDispatchPayload = null;
    let pendingTransferPayload = null;
    let pendingDispatchReturnPayload = null;
    let pendingExpiryDamagePayload = null;

    function formatNumber(val) {
      let num = parseInt(val, 10);
      if (isNaN(num)) num = 0;
      return num.toLocaleString('en-IN');
    }

    function updateLiveDateTime() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      
      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; 
      const hoursStr = String(hours).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const formattedStamp = `${day}-${month}-${year}, ${hoursStr}:${minutes}:${seconds} ${ampm}`;
      const elem = document.getElementById("live-datetime-stamp");
      if (elem) {
        elem.innerText = formattedStamp;
      }
    }

    setInterval(updateLiveDateTime, 1000);

setInterval(async () => {
      let emp = sessionStorage.getItem("employee");
      let sessionId = sessionStorage.getItem("sessionId");
      if (emp) {
        // yahan &t=${new Date().getTime()} add kiya hai taaki browser request ko cache na kare
        let url = `${GOOGLE_SHEET_URL}?action=ping&user=${encodeURIComponent(emp)}&t=${new Date().getTime()}`;
        if (sessionId) url += `&sessionId=${encodeURIComponent(sessionId)}`;
        
        try {
          let response = await fetch(url);
          let data = await response.json();
          
          // Agar backend se force logout ka status aaye toh session clear kardo
          if (data.status === "force_logged_out") {
            alert("⚠️ Admin has forced you to log out.");
            sessionStorage.clear();
            window.location.reload(); // showLoginPage() ki jagah reload karna zyada safe hai
          }
        } catch (e) {}
      }
    }, 30000);

    window.onload = function () {
      loadScansFromLocalStorage();
      let emp = sessionStorage.getItem("employee");
      let wh = sessionStorage.getItem("warehouse");
      let sessionId = sessionStorage.getItem("sessionId");
      
      if (emp && wh) {
        let url = `${GOOGLE_SHEET_URL}?action=ping&user=${encodeURIComponent(emp)}`;
        if (sessionId) url += `&sessionId=${encodeURIComponent(sessionId)}`;
        fetch(url).catch(e => {});
        
        syncDataAndShowDashboard();
      } else {
        showLoginPage();
      }
      updateLiveDateTime();
    };

    window.addEventListener('beforeunload', function (e) {
      let emp = sessionStorage.getItem("employee");
      let sessionId = sessionStorage.getItem("sessionId");
      if (emp) {
        let url = `${GOOGLE_SHEET_URL}?action=logout&user=${encodeURIComponent(emp)}&sessionId=${encodeURIComponent(sessionId || '')}`;
        fetch(url, { keepalive: true }).catch(err => {});
      }
      sessionStorage.clear(); 
    });

    function loadScansFromLocalStorage() {
      const stored = localStorage.getItem("userScansCache");
      if (stored) { try { userScansCache = JSON.parse(stored); } catch (e) { userScansCache = []; } }
    }

    function saveScansToLocalStorage() {
      localStorage.setItem("userScansCache", JSON.stringify(userScansCache));
    }

    async function fetchUserScansFromCloud() {
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=fallback`); 
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          userScansCache = data;
          saveScansToLocalStorage();
        }
        return userScansCache;
      } catch (e) {
        return userScansCache;
      }
    }

    async function fetchAllMetrics() {
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=getAllMetrics`);
        const data = await response.json();
        
        const billsElem = document.getElementById("todayBillsVal");
        if (billsElem) billsElem.innerHTML = `${formatNumber(data.todayBills || 0)} <span class="unit-pcs">NOS</span>`;

        const qaElem = document.getElementById("qaStockVal");
        if (qaElem) qaElem.innerHTML = `${formatNumber(data.qa || 0)} <span class="unit-pcs">PCS</span>`;
        
        const mainElem = document.getElementById("mainWarehouseStockVal");
        if (mainElem) mainElem.innerHTML = `${formatNumber(data.main || 0)} <span class="unit-pcs">PCS</span>`;
        
        const packingElem = document.getElementById("packingStockVal");
        if (packingElem) packingElem.innerHTML = `${formatNumber(data.packing || 0)} <span class="unit-pcs">PCS</span>`;
        
        const expiredElem = document.getElementById("expiredStockVal");
        if (expiredElem) expiredElem.innerHTML = `${formatNumber(data.expired || 0)} <span class="unit-pcs">PCS</span>`;
        
        const dispatchElem = document.getElementById("dispatchStockVal");
        if (dispatchElem) dispatchElem.innerHTML = `${formatNumber(data.dispatch || 0)} <span class="unit-pcs">PCS</span>`;
        
        const damageElem = document.getElementById("damageStockVal");
        if (damageElem) damageElem.innerHTML = `${formatNumber(data.damage || 0)} <span class="unit-pcs">PCS</span>`;

        const holdElem = document.getElementById("holdStockVal");
        if (holdElem) holdElem.innerHTML = `${formatNumber(data.hold || 0)} <span class="unit-pcs">PCS</span>`;
        
      } catch (e) {
        ["todayBillsVal", "qaStockVal", "mainWarehouseStockVal", "packingStockVal", "expiredStockVal", "dispatchStockVal", "damageStockVal", "holdStockVal"].forEach(id => {
            const el = document.getElementById(id);
            if(el && el.innerText === "Loading...") el.innerHTML = `0 <span class="unit-pcs">PCS</span>`;
        });
      }
    }

    async function showWarehouseStockDetails() {
      const targetWh = "QA (Quality Assurance)";
      openStockDetailsModal("<i class='fa-solid fa-box'></i> QA (Quality Assurance)", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=warehouseStockDetails&warehouse=${encodeURIComponent(targetWh)}`);
        const list = await response.json();
        renderStockDetailsTable("<i class='fa-solid fa-box'></i> QA (Quality Assurance)", list);
      } catch (e) {
        renderStockDetailsTable("<i class='fa-solid fa-box'></i> QA (Quality Assurance)", []);
      }
    }

    async function showMainWarehouseStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-warehouse'></i> Main Warehouse", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=mainWarehouseStockDetails`);
        const list = await response.json();
        renderStockDetailsTable("<i class='fa-solid fa-warehouse'></i> Main Warehouse", list);
      } catch (e) {
        renderStockDetailsTable("<i class='fa-solid fa-warehouse'></i> Main Warehouse", []);
      }
    }

    async function showPackingStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-box-open'></i> Packing Area", "Loading...");
      try {

    async function showExpiredStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-clock-rotate-left'></i> Near-Expiry Stock", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=expiredStockDetails`);

      } catch (e) {
        renderStockDetailsTable("<i class='fa-solid fa-clock-rotate-left'></i> Near-Expiry Stock", []);
      }
    }

    async function showDispatchStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-file-invoice'></i> Dispatched Qty", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=dispatchStockDetails`);
        const list = await response.json();
        renderStockDetailsTable("<i class='fa-solid fa-file-invoice'></i> Dispatched Qty", list);
      } catch (e) {
        renderStockDetailsTable("<i class='fa-solid fa-file-invoice'></i> Dispatched Qty", []);
      }
    }

    async function showDamageStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-ban'></i> Damaged Stock", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=damageStockDetails`);
        const list = await response.json();
        renderStockDetailsTable("<i class='fa-solid fa-ban'></i> Damaged Stock", list);
      } catch (e) {
        renderStockDetailsTable("<i class='fa-solid fa-ban'></i> Damaged Stock", []);
      }
    }

    async function showHoldStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-pause'></i> Hold Items", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=holdStockDetails`);
        const list = await response.json();
        renderStockDetailsTable("<i class='fa-solid fa-pause'></i> Hold Items", list);
      } catch (e) {
        renderStockDetailsTable("<i class='fa-solid fa-pause'></i> Hold Items", []);
      }
    }

    async function showSampleRoomStockDetails() {
      openStockDetailsModal("<i class='fa-solid fa-vials'></i> Control Sample Room", "Loading...");
      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=sampleRoomStockDetails`);
        const list = await response.json();
        renderStockDetailsTable("<i class='fa-solid fa-vials'></i> Contorl Sample Room", list);

    function formatShortDate(rawStr) {
      if (!rawStr) return "";
      if (rawStr.includes("GMT") || rawStr.includes("Standard Time") || rawStr.length > 20) {
        let d = new Date(rawStr);
        if (!isNaN(d.getTime())) {
          let m = String(d.getMonth() + 1).padStart(2, '0');
          let y = String(d.getFullYear()).slice(-2);
          return m + "-" + y;
        }
      }
      return rawStr;
    }

      try {

        let warehouses = await response.json();
        
        if (warehouses.length === 0) {
          whSelect.innerHTML = '<option value="">-- Invalid User / No Access --</option>';
        } else {
          let opts = '<option value="">-- Select Warehouse --</option>';
          warehouses.forEach(wh => {
            let displayText = wh === "All View" ? "All View (For Management Use Only)" : wh;
            opts += `<option value="${escapeHtml(wh)}">${escapeHtml(displayText)}</option>`;
          });
          whSelect.innerHTML = opts;

        }

        whSelect.innerHTML = '<option value="">-- Error loading warehouses --</option>';

    async function login() {
      let emp = document.getElementById("employee").value.trim();
      let pass = document.getElementById("password").value.trim();
      let wh = document.getElementById("warehouse").value;
      let loginBtn = document.getElementById("loginBtn");

      if (!emp || !pass || !wh) { alert("Please fill in Employee Name, Password, and select Warehouse!"); return; }

      if (loginBtn) { loginBtn.disabled = true; loginBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Authenticating..."; }

      try {
        const response = await fetch(`${GOOGLE_SHEET_URL}?action=login&employee=${encodeURIComponent(emp)}&password=${encodeURIComponent(pass)}&warehouse=${encodeURIComponent(wh)}`);
        const data = await response.json();

        if (data.status === "success") {
          sessionStorage.setItem("employee", data.employeeName || emp);
          sessionStorage.setItem("warehouse", wh);
          sessionStorage.setItem("role", data.role || "Standard");
          if (data.sessionId) {
            sessionStorage.setItem("sessionId", data.sessionId);
          }
          syncDataAndShowDashboard();
        } else {
          alert("❌ Access Denied: " + (data.message || "Invalid Employee Name or Password!"));
          if (loginBtn) { loginBtn.disabled = false; loginBtn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>'; }
        }
      } catch (e) {
        let msg = e.message;
        alert("⚠️ Connection error: " + msg);
        if (loginBtn) { loginBtn.disabled = false; loginBtn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>'; }
      }
    }

    async function downloadUserLogs() {
      try {
        let btn = document.querySelector("#modal-container .btn-emerald");
        if(btn) btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Exporting...";
        
        let res = await fetch(`${GOOGLE_SHEET_URL}?action=getUserLogs`);
        let data = await res.json();
        
        if (!data || data.length === 0) {
          alert("No login history found.");
          if(btn) btn.innerHTML = "<i class='fa-solid fa-file-excel'></i> Export Login History";
          return;
        }
        
        let exportData = data.map((item, idx) => ({
          "S.No": idx + 1,
          "User Name": item.user,
          "Role": item.role,
          "Warehouse": item.warehouse,
          "Login Time": item.loginTime,
          "Last Active / Logout": item.logoutTime,
          "Duration": item.duration
        }));
        
        let ws = XLSX.utils.json_to_sheet(exportData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Login History");
        XLSX.writeFile(wb, "System_Login_History_" + new Date().toISOString().slice(0,10) + ".xlsx");
        
        if(btn) btn.innerHTML = "<i class='fa-solid fa-file-excel'></i> Export Login History";
      } catch(e) {
        alert("Export Error: " + e.message);
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

      let rows = document.querySelectorAll(".purchase-item-row");
      let itemsArray = [];
      let submitBtn = document.querySelector("#modal-container button.btn-success");
      if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Preparing Files..."; }

      for (let i = 0; i < rows.length; i++) {
        let row = rows[i];
        let pCategory = row.querySelector(".p_category").value;
        let pName = row.querySelector(".p_name").value.trim();
        let pBatch = row.querySelector(".p_batch").value.trim();
        let pMfg = row.querySelector(".p_mfg").value;
        let pExp = row.querySelector(".p_exp").value;
        let pMrp = row.querySelector(".p_mrp").value;
        let rawQty = parseInt(row.querySelector(".p_qty").value, 10) || 1;
        let fileInput = row.querySelector(".p_coa");

        if (!pCategory || !pName || !pBatch) { 
          alert(`Please fill Category, Product Name, and Batch in Product #${i + 1}!`); 
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit All Entries"; }
          return; 
        }

        let fileData = null;
        if (fileInput && fileInput.files.length > 0) {
           let file = fileInput.files[0];
           if (file.size > 5 * 1024 * 1024) { 
              alert(`COA File for ${pName} is too large. Max 5MB allowed.`);
              if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit All Entries"; }
              return;
           }
           let base64Full = await readFileAsBase64(file);
           fileData = {
              filename: file.name,
              mimeType: file.type,
              base64: base64Full.split(",")[1]
           };
        }

        let finalQty = (pCategory.toLowerCase() === "tablets") ? rawQty * 10 : rawQty;

        itemsArray.push({

          product: pName.toUpperCase(), 
          batch: pBatch.toUpperCase(),

      if (submitBtn) { submitBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Saving Data to Cloud..."; }

      let payload = {
        action: "Purchase Entry", user: sessionStorage.getItem("employee") || "",

      try {

          body: JSON.stringify(payload)
        });
        const resData = JSON.parse(await response.text());

        if (resData.status === "success") {
          alert(`✅ All ${itemsArray.length} items saved successfully!`);
          closeModalAndResume(); syncDataAndShowDashboard();
        } else {
          alert("❌ Error: " + resData.message);
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit All Entries"; }
        }
      } catch (e) {
        alert("⚠️ Error: " + e.message);
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerText = "Submit All Entries"; }
      }
    }

    async function handleExpiryDamagePdfUpload(input) {
      if (!input.files || input.files.length === 0) return;
      let file = input.files[0];
      
      try {
        let arrayBuffer = await file.arrayBuffer();
        let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let textItems = [];

        for (let i = 1; i <= pdf.numPages; i++) {
          let page = await pdf.getPage(i);
          let textContent = await page.getTextContent();
          
          textContent.items.forEach(item => {
            textItems.push({
              str: item.str.trim(),
              x: item.transform[4],
              y: item.transform[5],
              page: i
            });
          });
        }

        let fullText = textItems.map(item => item.str).join(" ");
        let invoiceMatch = fullText.match(/Invoice\s*No\.?\s*([A-Z0-9\-]+)/i) || fullText.match(/CA[0-9]+/i);
        let invoiceNo = invoiceMatch ? (invoiceMatch[1] || invoiceMatch[0]) : "EXP-" + Math.floor(Math.random() * 10000);

        let itemsFound = [];

        let pagesMap = {};
        textItems.forEach(item => {
          if (!pagesMap[item.page]) pagesMap[item.page] = [];
          pagesMap[item.page].push(item);
        });

        Object.keys(pagesMap).forEach(pageNum => {
          let pageItems = pagesMap[pageNum];
          let rowsMap = {};
          
          pageItems.forEach(item => {
            let yKey = Math.round(item.y / 4) * 4;
            if (!rowsMap[yKey]) rowsMap[yKey] = [];
            rowsMap[yKey].push(item);
          });

          let sortedYKeys = Object.keys(rowsMap).sort((a, b) => b - a); 

          sortedYKeys.forEach(yKey => {
            let rowElements = rowsMap[yKey].sort((a, b) => a.x - b.x); 
            let texts = rowElements.map(el => el.str).filter(str => str !== "");
            let rowString = texts.join(" ");

            if (/(E-Mail|Invoice|Due Date|L\.R\.|E-WAY|IRN|Party Name|DELIVERY AT|TOTAL|GST|Terms|A\/c|IFSC|Rs\.|Discount|@gmail\.com|Phone:|D\.L\.No|GSTIN|Bank Details|Grand Total|CLASS|TAXABLE AMT)/i.test(rowString)) {
              return;
            }

            let itemRegex = /(?:(?:^|\s)(\d+)\s*\.\s+)?(\d+)\s+(.+?)\s+([A-Z0-9\-\/_]+)\s+(\d{1,2}\/\d{2,4})\s+(\d{6,10})\s+\d+(\.\d+)?/i;
            let match = rowString.match(itemRegex);

            if (match) {
              let qty = parseInt(match[2], 10);
              let rawProd = match[3].trim();
              let batch = match[4].trim();
              
              rawProd = rawProd.replace(/^[A-Z]{3,5}\s+/, ''); 
              rawProd = rawProd.replace(/^(1\*\d+|[0-9.]+\s*(ML|GM|MG|ml|gm|mg))\s+/i, '').trim();

              if (qty > 0 && rawProd.length > 2 && batch.length > 2) {
                let exists = itemsFound.some(i => i.product === rawProd.toUpperCase() && i.batch === batch.toUpperCase());
                if (!exists) {
                  itemsFound.push({
                    product: rawProd.toUpperCase(),
                    batch: batch.toUpperCase(),
                    qty: qty
                  });
                }
              }
            }
          });
        });

        if (itemsFound.length === 0) {
          alert("⚠️ Failed to extract products. Ensure the PDF format matches the expected Challan structure.");
          input.value = "";
          return;
        }

        pendingExpiryDamagePayload = {
          action: "expiry_damage_dispatch",
          user: sessionStorage.getItem("employee") || "",
          invoiceNo: invoiceNo,
          items: itemsFound
        };

        openExpiryDamageConfirmationModal();
      } catch (err) {
        console.error(err);
        alert("⚠️ PDF Parsing Error: " + err.message);
      }
      input.value = "";
    }

    function populateTransferBatches() {

    function promptTransferConfirmation() {
      let prod = document.getElementById("t_product").value.trim();
      let batch = document.getElementById("t_batch").value.trim();
      let qty = parseInt(document.getElementById("t_qty").value, 10) || 1;
      let fromWh = document.getElementById("t_from").value;
      let toWh = document.getElementById("t_to").value;
      
      let qaRemark = "";

      if (!prod || !batch) { alert("Please select Product Name and Batch No!"); return; }
      if (fromWh === toWh) { alert("From and To Warehouse cannot be the same!"); return; }

      if (fromWh === "QA (Quality Assurance)") {
        let remarkSelect = document.getElementById("t_qa_remark_select");
        if (remarkSelect) {
          if (remarkSelect.value === "Other") {
            qaRemark = document.getElementById("t_qa_remark_other").value.trim();
          } else {
            qaRemark = remarkSelect.value.trim();
          }
          
          if (!qaRemark) {
            alert("QA Remarks is mandatory when transferring from QA (Quality Assurance)!");
            return;
          }
        }
      }

      pendingTransferPayload = {
        action: "transfer",
        user: sessionStorage.getItem("employee") || "",
        product: prod.toUpperCase(),
        batch: batch.toUpperCase(),
        qty: qty,
        fromWarehouse: fromWh,
        toWarehouse: toWh,
        qaRemark: qaRemark
      };

      let remarkHtml = qaRemark ? `<b>QA Remarks:</b> ${escapeHtml(qaRemark)}<br>` : "";

      document.getElementById("modal-container").innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box" style="max-height: 90vh; overflow-y: auto;">
            <button onclick="closeModalAndResume()" class="modal-close-btn" title="Close"><i class="fa-solid fa-xmark"></i></button>

              <b>Quantity:</b> ${formatNumber(qty)} pcs<br>

              <b>To Location:</b> ${escapeHtml(toWh)}<br>
              ${remarkHtml}
            </div>
            <p style="font-weight:700; color:var(--danger); font-size:0.9rem;">
              Are you sure you want to transfer the stock?
            </p>
            <div style="display:flex; gap:12px; margin-top:8px;">
              <button onclick="executeStockTransfer()" class="btn-success">Yes, Transfer</button>
              <button onclick="openTransferModal()" class="btn-secondary">Back / Edit</button>
            </div>
          </div>
        </div>
      `;
    }

    async function executeStockTransfer() {
      if (!pendingTransferPayload) return;

      let confirmBtn = document.querySelector("#modal-container button.btn-success");
      if (confirmBtn) {
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Transferring...";
      }

      try {
        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(pendingTransferPayload)
        });

        let resData = JSON.parse(await response.text());

        if (resData.status === "success") {
          alert("✅ " + resData.message);
          pendingTransferPayload = null;
          closeModalAndResume();
          syncDataAndShowDashboard();
        } else {
          alert("❌ TRANSFER FAILED:\n\n" + resData.message);
          closeModalAndResume();
        }
      } catch (e) {
        alert("⚠️ Connection Error: " + e.message);
        closeModalAndResume();
      }
    }

                        token.length >= 3 &&
                        tokens.some(t =>
                            t === token ||
                            t.includes(token) ||
                            token.includes(t)
                        )
                    ) {

                        matched++;

                    }

                }


                const score =
                    matched /
                    Math.max(
                        pTokens.length,
                        1
                    );


                if (
                    score >= 0.65 &&
                    (
                        !best ||
                        score > best.score
                    )
                ) {

                    best = {

                        product: p.full,
                        confidence: score

                    };

                }

            }


            return best;

        }


        // ========================================================
        // EXTRACT ITEMS
        // ========================================================

        const itemsFound = [];


        for (const row of serialRows) {

            const rowText =
                row.items
                    .map(x => x.str)
                    .join(" ");


            if (
                isIgnoredRow(rowText)
            ) {
                continue;
            }


            const headers =
                pageHeaders[row.page];


            const productResult =
                findProduct(row.items);


            // ====================================================
            // PRODUCT NOT FOUND
            // ====================================================

            if (!productResult) {

                itemsFound.push({

                    serial: row.serial,
                    page: row.page,

                    product: "",
                    batch: "",
                    exp: "",

                    billedQty: 0,
                    freeQty: 0,
                    qty: 0,

                    confidence: 0,

                    status:
                        "PRODUCT_NOT_MATCHED",

                    rawText: rowText

                });

                continue;

            }


            // ====================================================
            // NUMERIC VALUES
            // ====================================================

            const numeric =
                row.items
                    .map(item => ({

                        ...item,

                        value:
                            numberValue(
                                item.str
                            )

                    }))
                    .filter(
                        item =>
                            item.value !== null
                    );


            // ====================================================
            // QTY + FREE
            // ====================================================

            let billedQty = null;

            let freeQty = 0;


            /*
             * IMPORTANT:
             *
             * MARG often does NOT print 0
             * in FREE column.
             *
             * Therefore:
             *
             * QTY = 10
             * FREE = blank
             *
             * MUST result:
             *
             * billedQty = 10
             * freeQty   = 0
             *
             */


            let qtyFreeCandidates =
                numeric
                    .filter(item => {

                        // Must be after Qty column
                        if (
                            headers.qty !== null &&
                            item.x <
                            headers.qty - 10
                        ) {

                            return false;

                        }


                        // Must be before Batch
                        if (
                            headers.batch !== null &&
                            item.x >=
                            headers.batch - 10
                        ) {

                            return false;

                        }


                        return true;

                    })
                    .sort(
                        (a, b) =>
                            a.x - b.x
                    );


            // ====================================================
            // FIND BILLED QTY
            // ====================================================

            if (
                headers.qty !== null
            ) {

                const qtyCandidates =
                    qtyFreeCandidates

                        .map(item => ({

                            ...item,

                            distance:
                                Math.abs(
                                    item.x -
                                    headers.qty
                                )

                        }))

                        .filter(
                            item =>
                                item.distance <= 35
                        )

                        .sort(
                            (a, b) =>
                                a.distance -
                                b.distance
                        );


                if (
                    qtyCandidates.length
                ) {

                    billedQty =
                        qtyCandidates[0]
                            .value;

                }

            }


            // ====================================================
            // FIND FREE
            // ====================================================

            /*
             * FREE WILL ONLY BE ACCEPTED IF:
             *
             * 1. There is a separate numeric value
             * 2. It is AFTER Qty
             * 3. It is BEFORE Batch
             * 4. It is close to FREE header
             * 5. It is NOT the same physical Qty value
             */

            if (
                billedQty !== null &&
                headers.free !== null
            ) {

                const freeCandidates =
                    qtyFreeCandidates

                        .filter(item => {

                            // Must be AFTER Qty
                            if (
                                headers.qty !== null &&
                                item.x <=
                                headers.qty + 8
                            ) {

                                return false;

                            }


                            // Must be BEFORE Batch
                            if (
                                headers.batch !== null &&
                                item.x >=
                                headers.batch - 10
                            ) {

                                return false;

                            }


                            // Must be close to Free
                            const d =
                                Math.abs(
                                    item.x -
                                    headers.free
                                );


                            if (d > 30)
                                return false;


                            return true;

                        })

                        .map(item => ({

                            ...item,

                            distance:
                                Math.abs(
                                    item.x -
                                    headers.free
                                )

                        }))

                        .sort(
                            (a, b) =>
                                a.distance -
                                b.distance
                        );


                if (
                    freeCandidates.length
                ) {

                    const candidate =
                        freeCandidates[0];


                    /*
                     * FINAL PROTECTION:
                     *
                     * If candidate is physically
                     * close to Qty position,
                     * it is NOT FREE.
                     */

                    const sameAsQty =
                        headers.qty !== null &&
                        Math.abs(
                            candidate.x -
                            headers.qty
                        ) <= 12;


                    if (!sameAsQty) {

                        freeQty =
                            candidate.value;

                    } else {

                        freeQty = 0;

                    }

                }

            }


            // ====================================================
            // ABSOLUTE SAFETY
            // ====================================================

            /*
             * NEVER automatically copy Qty into Free.
             */

            if (
                billedQty !== null &&
                freeQty === billedQty
            ) {

                const actualSeparateFree =
                    qtyFreeCandidates.some(
                        item => {

                            if (
                                headers.qty !== null &&
                                item.x <=
                                headers.qty + 8
                            ) {

                                return false;

                            }


                            if (
                                headers.batch !== null &&
                                item.x >=
                                headers.batch - 10
                            ) {

                                return false;

                            }


                            if (
                                headers.free !== null &&
                                Math.abs(
                                    item.x -
                                    headers.free
                                ) > 30
                            ) {

                                return false;

                            }


                            if (
                                headers.qty !== null &&
                                Math.abs(
                                    item.x -
                                    headers.qty
                                ) <= 12
                            ) {

                                return false;

                            }


                            return true;

                        }
                    );


                if (
                    !actualSeparateFree
                ) {

                    freeQty = 0;

                }

            }


            // ====================================================
            // FINAL QTY DEFAULTS
            // ====================================================

            if (
                billedQty === null ||
                !Number.isFinite(billedQty)
            ) {

                billedQty = 0;

            }


            if (
                freeQty === null ||
                !Number.isFinite(freeQty)
            ) {

                freeQty = 0;

            }


            // ====================================================
            // TOTAL QTY
            // ====================================================

            const totalQty =
                Number(billedQty) +
                Number(freeQty);


            // ====================================================
            // DEBUG
            // ====================================================

            console.log(
                "================================"
            );

            console.log(
                "MARG QTY/FREE"
            );

            console.log(
                "Product:",
                productResult.product
            );

            console.log(
                "Qty Header X:",
                headers.qty
            );

            console.log(
                "Free Header X:",
                headers.free
            );

            console.log(
                "Batch Header X:",
                headers.batch
            );

            console.log(
                "Numeric Candidates:",
                qtyFreeCandidates.map(
                    x => ({
                        value: x.value,
                        x: x.x
                    })
                )
            );

            console.log(
                "Billed Qty:",
                billedQty
            );

            console.log(
                "Free Qty:",
                freeQty
            );

            console.log(
                "Total Qty:",
                totalQty
            );

            console.log(
                "================================"
            );


            // ====================================================
            // FALLBACK QTY
            // ====================================================

            if (
                billedQty === 0
            ) {

                const productMatchItem =
                    row.items.find(item =>
                        alphaNum(item.str)
                            .includes(
                                alphaNum(
                                    productResult.product
                                )
                            )
                    );


                const productX =
                    productMatchItem?.x ?? 0;


                const afterProduct =
                    numeric
                        .filter(
                            item =>
                                item.x >
                                productX
                        )
                        .sort(
                            (a, b) =>
                                a.x - b.x
                        );


                if (
                    afterProduct.length
                ) {

                    billedQty =
                        afterProduct[0].value;

                }

            }


            // ====================================================
            // BATCH
            // ====================================================

            let batch = "";


            const batchCandidates =
                row.items

                    .filter(item => {

                        const s =
                            item.str.trim();


                        if (
                            !isBatchLike(s)
                        ) {
                            return false;
                        }


                        if (
                            isDateLike(s)
                        ) {
                            return false;
                        }


                        if (
                            s.toUpperCase() ===
                            productResult.product
                                .toUpperCase()
                        ) {
                            return false;
                        }


                        return true;

                    })

                    .map(item => ({

                        ...item,

                        distance:
                            distance(
                                item.x,
                                headers.batch
                            )

                    }))

                    .sort(
                        (a, b) =>
                            a.distance -
                            b.distance
                    );


            if (
                batchCandidates.length
            ) {

                const selected =
                    batchCandidates.find(
                        x =>
                            x.distance <= 55
                    );


                if (selected) {

                    batch =
                        selected.str.trim();

                }

            }


            // ====================================================
            // EXPIRY
            // ====================================================

            let exp = "";


            const expiryCandidates =
                row.items

                    .filter(item =>
                        isDateLike(
                            item.str
                        )
                    )

                    .map(item => ({

                        ...item,

                        distance:
                            distance(
                                item.x,
                                headers.exp
                            )

                    }))

                    .sort(
                        (a, b) =>
                            a.distance -
                            b.distance
                    );


            if (
                expiryCandidates.length
            ) {

                const selected =
                    expiryCandidates.find(
                        x =>
                            headers.exp !== null
                                ? x.distance <= 50
                                : true
                    );


                if (selected) {

                    exp =
                        selected.str.trim();

                }

            }


            // ====================================================
            // HSN
            // ====================================================

            let hsn = "";


            const hsnCandidates =
                row.items
                    .map(
                        x =>
                            x.str.trim()
                    )
                    .filter(
                        x =>
                            /^\d{6,8}$/
                                .test(x)
                    );


            if (
                hsnCandidates.length
            ) {

                hsn =
                    hsnCandidates[0];

            }


            // ====================================================
            // STATUS
            // ====================================================

            let status = "OK";


            if (
                !productResult.product
            ) {

                status =
                    "PRODUCT_NOT_MATCHED";

            }


            if (
                billedQty <= 0
            ) {

                status =
                    "QTY_SUSPICIOUS";

            }


            if (!batch) {

                status =
                    "BATCH_SUSPICIOUS";

            }


            if (
                productResult.confidence < 0.75 &&
                status === "OK"
            ) {

                status =
                    "LOW_CONFIDENCE";

            }


            // ====================================================
            // PUSH ITEM
            // ====================================================

            itemsFound.push({

                serial:
                    row.serial,

                page:
                    row.page,

                product:
                    productResult.product,

                batch:
                    batch || "UNKNOWN",

                exp:
                    exp || "",

                hsn:
                    hsn,

                billedQty:
                    billedQty,

                freeQty:
                    freeQty,

                qty:
                    Number(billedQty) +
                    Number(freeQty),

                confidence:
                    Number(
                        productResult
                            .confidence
                            .toFixed(2)
                    ),

                status:
                    status,

                rawText:
                    rowText

            });

        }


        // ========================================================
        // SORT BY SERIAL
        // ========================================================

        itemsFound.sort(
            (a, b) =>
                a.serial - b.serial
        );


        // ========================================================
        // REMOVE EXACT PHYSICAL DUPLICATES
        // ========================================================

        const uniqueRows = [];

        const physicalRowKeys =
            new Set();


        for (
            const item of itemsFound
        ) {

            const key =
                `${item.page}|${item.serial}|${item.rawText}`;


            if (
                physicalRowKeys.has(key)
            ) {

                continue;

            }


            physicalRowKeys.add(key);

            uniqueRows.push(item);

        }


        const finalItems =
            uniqueRows;


        // ========================================================
        // EXPECTED TOTAL ITEMS
        // ========================================================

        let expectedItems = null;


        const itemMatch =
            allText.match(
                /Total\s+Items\s*[:\-]?\s*(\d+)/i
            );


        if (itemMatch) {

            expectedItems =
                parseInt(
                    itemMatch[1],
                    10
                );

        }


        // ========================================================
        // EXPECTED TOTAL QTY
        // ========================================================

        let expectedQty = null;


        const qtyMatch =
            allText.match(
                /Total\s+Qty\s*[:\-]?\s*([\d,]+)/i
            );


        if (qtyMatch) {

            expectedQty =
                parseInt(
                    qtyMatch[1]
                        .replace(/,/g, ""),
                    10
                );

        }


        // ========================================================
        // EXTRACTED TOTALS
        // ========================================================

        const extractedItems =
            finalItems.length;


        const extractedQty =
            finalItems.reduce(
                (sum, item) =>
                    sum +
                    Number(
                        item.qty || 0
                    ),
                0
            );


        // ========================================================
        // SERIAL VALIDATION
        // ========================================================

        const serialNumbers =
            finalItems
                .map(
                    x => x.serial
                )
                .filter(
                    x =>
                        Number.isFinite(x)
                );


        const duplicateSerials =
            serialNumbers.filter(
                (v, i, arr) =>
                    arr.indexOf(v) !== i
            );


        let missingSerials = [];


        if (
            expectedItems !== null
        ) {

            for (
                let i = 1;
                i <= expectedItems;
                i++
            ) {

                if (
                    !serialNumbers.includes(i)
                ) {

                    missingSerials.push(i);

                }

            }

        }


        // ========================================================
        // VALIDATION
        // ========================================================

        const validationErrors = [];


        if (
            expectedItems !== null &&
            extractedItems !== expectedItems
        ) {

            validationErrors.push(
                `ITEM COUNT MISMATCH: MARG=${expectedItems}, READ=${extractedItems}`
            );

        }


        if (
            expectedQty !== null &&
            extractedQty !== expectedQty
        ) {

            validationErrors.push(
                `QTY MISMATCH: MARG=${expectedQty}, READ=${extractedQty}`
            );

        }


        if (
            duplicateSerials.length
        ) {

            validationErrors.push(
                `DUPLICATE SERIAL: ${duplicateSerials.join(", ")}`
            );

        }


        if (
            missingSerials.length
        ) {

            validationErrors.push(
                `MISSING SERIAL: ${missingSerials.join(", ")}`
            );

        }


        // ========================================================
        // SUSPICIOUS ITEMS
        // ========================================================

        const suspiciousItems =
            finalItems.filter(
                item =>
                    item.status !== "OK"
            );


        // ========================================================
        // VALIDATION SUMMARY
        // ========================================================

        const validationPassed =
            validationErrors.length === 0 &&
            suspiciousItems.length === 0;


        console.log(
            "================================="
        );

        console.log(
            "MARG PDF VALIDATION"
        );

        console.log(
            "================================="
        );

        console.log(
            "Invoice:",
            invoiceNo
        );

        console.log(
            "Expected Items:",
            expectedItems
        );

        console.log(
            "Extracted Items:",
            extractedItems
        );

        console.log(
            "Expected Qty:",
            expectedQty
        );

        console.log(
            "Extracted Qty:",
            extractedQty
        );

        console.log(
            "Suspicious Rows:",
            suspiciousItems.length
        );

        console.log(
            "Validation:",
            validationPassed
        );

        console.log(
            "================================="
        );


        // ========================================================
        // NO ITEMS
        // ========================================================

        if (
            finalItems.length === 0
        ) {

            alert(
                "❌ Invalid PDF Format\n\n" +
                "Please check the invoice format."
            );


            input.value = "";

            return;

        }


        // ========================================================
        // VALIDATION FAILURE
        // ========================================================

        if (
            !validationPassed
        ) {

            let message =
                "⚠️ INVOICE VERIFICATION FAILED\n\n";


            if (invoiceNo) {

                message +=
                    `Invoice: ${invoiceNo}\n\n`;

            }


            if (
                expectedItems !== null
            ) {

                message +=
                    `MARG Total Items: ${expectedItems}\n`;

            }


            message +=
                `System Read Items: ${extractedItems}\n\n`;


            if (
                expectedQty !== null
            ) {

                message +=
                    `MARG Total Qty: ${expectedQty}\n`;

            }


            message +=
                `System Read Qty: ${extractedQty}\n\n`;


            if (
                validationErrors.length
            ) {

                message +=
                    "Problems:\n";


                validationErrors
                    .slice(0, 10)
                    .forEach(error => {

                        message +=
                            "• " +
                            error +
                            "\n";

                    });

            }


            if (
                suspiciousItems.length
            ) {

                message +=
                    `\n⚠️ Suspicious Rows: ${suspiciousItems.length}\n`;


                suspiciousItems
                    .slice(0, 10)
                    .forEach(item => {

                        message +=
                            `• S.No ${item.serial}: ` +
                            `${item.product || "UNKNOWN"} ` +
                            `[${item.status}]\n`;

                    });

            }


            message +=
                "\n❌ Data will not save automatically.";


            alert(message);


            // ====================================================
            // REVIEW PAYLOAD
            // ====================================================

            pendingDispatchPayload = {

                action:
                    "dispatch-review",

                user:
                    sessionStorage.getItem(
                        "employee"
                    ) || "",

                warehouse:
                    sessionStorage.getItem(
                        "warehouse"
                    ) || "",

                invoiceNo:
                    invoiceNo,

                items:
                    finalItems,

                validation: {

                    passed:
                        false,

                    expectedItems:
                        expectedItems,

                    extractedItems:
                        extractedItems,

                    expectedQty:
                        expectedQty,

                    extractedQty:
                        extractedQty,

                    errors:
                        validationErrors,

                    suspiciousItems:
                        suspiciousItems

                }

            };


            input.value = "";

            return;

        }


        // ========================================================
        // EVERYTHING VERIFIED
        // ========================================================

        pendingDispatchPayload = {

            action:
                "dispatch",

            user:
                sessionStorage.getItem(
                    "employee"
                ) || "",

            warehouse:
                sessionStorage.getItem(
                    "warehouse"
                ) || "",

            invoiceNo:
                invoiceNo,

            items:
                finalItems,

            validation: {

                passed:
                    true,

                expectedItems:
                    expectedItems,

                extractedItems:
                    extractedItems,

                expectedQty:
                    expectedQty,

                extractedQty:
                    extractedQty

            }

        };


        // ========================================================
        // SUCCESS MESSAGE
        // ========================================================

        alert(

            "✅ Invoice successfully verified.\n\n" +

            `Invoice: ${invoiceNo}\n` +

            `Items: ${extractedItems}\n` +

            `Total Qty: ${extractedQty}\n\n` +

            "All validation checks passed."

        );


        // ========================================================
        // EXISTING CONFIRMATION MODAL
        // ========================================================

        openDispatchConfirmationModal();


    } catch (err) {

        console.error(
            "MARG PDF Parser Error:",
            err
        );


        alert(

            "❌ PDF Parsing Error\n\n" +

            err.message

        );

    } finally {

        input.value = "";

    }

}


function openDispatchConfirmationModal() {
      if (!pendingDispatchPayload) return;
      let itemsRows = pendingDispatchPayload.items.map((item, idx) => `
        <tr>
          <td><b>${escapeHtml(item.product)}</b></td>
          <td>
            <input type="text" id="edit_d_batch_${idx}" value="${escapeHtml(item.batch)}" style="width: 100px; padding: 6px; font-size: 0.85rem; text-transform: uppercase; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; background: #fff;">
          </td>
          <td>
            <input type="number" id="edit_d_billed_${idx}" value="${item.billedQty}" min="0" style="width: 70px; padding: 6px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; background: #fff;">
          </td>
          <td>
            <input type="number" id="edit_d_free_${idx}" value="${item.freeQty}" min="0" style="width: 70px; padding: 6px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 4px; outline: none; background: #fff;">
          </td>
        </tr>
      `).join("");

      document.getElementById("modal-container").innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box" style="max-width: 650px;">
            <button onclick="closeModalAndResume()" class="modal-close-btn" title="Close"><i class="fa-solid fa-xmark"></i></button>
            <h3 style="color:var(--primary);"><i class="fa-solid fa-clipboard-check"></i> Verify Dispatch PDF</h3>
            <p style="font-size:0.9rem;"><b>Invoice No:</b> ${escapeHtml(pendingDispatchPayload.invoiceNo)}</p>
            
            <div style="max-height: 45vh; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 4px; margin-top: 10px;">
              <table class="pdf-item-table" style="width:100%; margin-top: 0; border: none;">
                <thead style="position: sticky; top: 0; z-index: 1; background: var(--primary-light);">
                  <tr>
                    <th>Product</th>
                    <th>Batch no</th>
                    <th>Qty</th>
                    <th>Free</th>
                  </tr>
                </thead>
                <tbody>
                  ${itemsRows}
                </tbody>
              </table>
            </div>

            <p style="font-weight:700; color:var(--danger); margin-top:10px;">Are you sure to proceed? You can edit Batch, Qty & Free before submitting.</p>
            <div style="display:flex; gap:12px; margin-top:8px;">
              <button onclick="confirmAndProceedDispatch()" class="btn-success">Yes, Proceed</button>
              <button onclick="closeModalAndResume()" class="btn-danger">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    async function confirmAndProceedDispatch() {
      if (!pendingDispatchPayload) return;
      
      let items = pendingDispatchPayload.items;
      for (let i = 0; i < items.length; i++) {
        let newBatch = document.getElementById("edit_d_batch_" + i).value.trim();
        let newBilled = parseInt(document.getElementById("edit_d_billed_" + i).value, 10) || 0;
        let newFree = parseInt(document.getElementById("edit_d_free_" + i).value, 10) || 0;
        
        if (!newBatch) {
          alert("Batch number cannot be empty for " + items[i].product);
          return;
        }
        
        items[i].batch = newBatch.toUpperCase();
        items[i].billedQty = newBilled;
        items[i].freeQty = newFree;
        items[i].qty = newBilled + newFree;
      }

      let confirmBtn = document.querySelector("#modal-container button.btn-success");
      if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Processing..."; }

      try {
        let response = await fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(pendingDispatchPayload)
        });
        
        let text = await response.text();
        
        if (text.includes("<!DOCTYPE") || text.includes("<html")) {
            throw new Error("Google blocked the request! Please deploy your Apps Script again with 'Who has access' set to 'Anyone'.");
        }

        let resData = JSON.parse(text);

        })).sort((a, b) => b.base.length - a.base.length);

        const isNumber = value => /^[+-]?\d+(?:,\d{3})*(?:\.\d+)?$/.test(String(value || "").trim());
        const numberValue = value => isNumber(value) ? Number(String(value).replace(/,/g, "").trim()) : null;
        const isDateLike = value => /^\d{1,2}[\/-]\d{2,4}$/.test(String(value || "").trim());
        const distance = (a, b) => (a === null || b === null) ? 99999 : Math.abs(a - b);

        const pages = {};
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            const page = await pdf.getPage(pageNo);
            const content = await page.getTextContent();
            pages[pageNo] = content.items.map((item, index) => ({
                str: String(item.str || "").trim(),
                x: Number(item.transform?.[4] || 0),
                y: Number(item.transform?.[5] || 0),
                index, page: pageNo
            })).filter(item => item.str);
        }

        let allText = Object.values(pages).flat().map(x => x.str).join(" ");
        let invoiceMatch = allText.match(/Invoice\s*No\.?\s*[:\-]?\s*([A-Z0-9\-]+)/i) || allText.match(/CN[0-9]+/i);
        const invoiceNo = invoiceMatch ? (invoiceMatch[1] || invoiceMatch[0]) : "RET-" + Math.floor(Math.random() * 10000);

        const pageHeaders = {};
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            pageHeaders[pageNo] = { serial: null, qty: null, free: null, batch: null, exp: null, mrp: null };
            for (const item of pages[pageNo]) {
                const t = normalize(item.str).replace(/\s+/g, "");
                if (t === "SN." || t === "SN" || t === "S.NO." || t === "SNO.") pageHeaders[pageNo].serial = item.x;
                if (t === "QTY" || t === "QTY.") pageHeaders[pageNo].qty = item.x;
                if (t === "FREE" || t === "FREE." || t === "FREE..") pageHeaders[pageNo].free = item.x;
                if (t === "BATCH" || t === "BATCHNO" || t === "BATCHNO." || t === "BATCHNO:") pageHeaders[pageNo].batch = item.x;
                if (t === "EXP" || t === "EXP.") pageHeaders[pageNo].exp = item.x;
                if (t === "M.R.P" || t === "MRP" || t === "M.R.P.") pageHeaders[pageNo].mrp = item.x;
            }
        }

        let previousHeaders = { serial: null, qty: null, free: null, batch: null, exp: null, mrp: null };
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            Object.keys(pageHeaders[pageNo]).forEach(key => {
                if (pageHeaders[pageNo][key] === null) pageHeaders[pageNo][key] = previousHeaders[key];
                else previousHeaders[key] = pageHeaders[pageNo][key];
            });
        }

        const rows = [];
        for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
            const sorted = [...pages[pageNo]].sort((a, b) => Math.abs(a.y - b.y) < 2 ? a.x - b.x : b.y - a.y);
            const pageRows = [];
            for (const item of sorted) {
                let row = pageRows.find(r => Math.abs(r.y - item.y) <= 2.8);
                if (!row) { row = { page: pageNo, y: item.y, items: [] }; pageRows.push(row); }
                row.items.push(item);
            }
            pageRows.sort((a, b) => b.y - a.y);
            rows.push(...pageRows);
        }

        const serialRows = [];
        for (const row of rows) {
            const rowText = row.items.map(x => x.str).join(" ");
            const strictMatch = rowText.match(/^\s*(\d{1,4})\s*[.)](?!\d)/);
            const looseMatch = rowText.match(/^\s*(\d{1,4})\b/);
            let serial = null;

            if (strictMatch) serial = parseInt(strictMatch[1], 10);
            else if (looseMatch) {
                const rowAlphaNum = alphaNum(rowText);
                if (PRODUCT_MAP.some(p => rowAlphaNum.includes(p.base))) serial = parseInt(looseMatch[1], 10);

        function findProduct(rowItems) {
